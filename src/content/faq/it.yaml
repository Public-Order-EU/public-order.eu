items:
  - q: "Chi c’è dietro questa petizione?"
    a: |
      La European Public Order Initiative è organizzata collettivamente da cittadini e residenti di diversi Paesi europei. Siamo indipendenti e non affiliati ad alcun partito politico, governo, impresa o istituzione dell’UE.

      Presentiamo deliberatamente la petizione in forma collettiva, senza portavoce individuali, affinché la discussione resti concentrata sulle proposte e non sulle persone. Per la sicurezza delle persone coinvolte, non pubblichiamo i nomi né gli indirizzi dei singoli organizzatori. Gli organizzatori sono responsabili della petizione e dei suoi dati e possono sempre essere contattati (si vedano le note legali).

  - q: "Si tratta di un’iniziativa dei cittadini europei ufficiale?"
    a: |
      No. Un’iniziativa dei cittadini europei (ICE) ufficiale deve essere registrata presso la Commissione europea e raccogliere le firme secondo le regole rigorose stabilite dal regolamento (UE) 2019/788. Questa è una petizione indipendente che mostra il sostegno dell’opinione pubblica e viene consegnata ai decisori.

      Le firme raccolte qui non possono essere conteggiate per una ICE ufficiale. Se gli organizzatori ne registreranno mai una, lo diremo chiaramente e spiegheremo come firmarla.

  - q: "In realtà non state cercando di limitare il diritto di manifestare?"
    a: |
      No. La prima richiesta della petizione è tutelare la protesta pacifica, anche quella con cui potremmo non essere d’accordo. Riteniamo che la violenza sia una delle maggiori minacce a questo diritto: mette in pericolo i partecipanti pacifici, scredita la loro causa ed è spesso usata come argomento per limitare del tutto le manifestazioni.

      La petizione riguarda specifici atti violenti, come incendi dolosi, saccheggi e aggressioni a persone o beni, e non le opinioni di alcun gruppo. Ogni misura deve rispettare la libertà di riunione tutelata dall’articolo 11 della Convenzione europea dei diritti dell’uomo.

  - q: "Impiegare l’esercito per l’ordine pubblico non è pericoloso per la democrazia?"
    a: |
      È una preoccupazione seria e la storia offre buoni motivi di cautela. È proprio per questo che la petizione sostiene l’assistenza militare solo come ultima risorsa, quando la capacità della polizia è palesemente insufficiente, e solo a condizioni rigorose: un quadro giuridico adottato in anticipo dal Parlamento, una decisione delle autorità civili, il controllo parlamentare, limiti di durata, la direzione della polizia, compiti principalmente di supporto e mai contro riunioni pacifiche.

      Diversi Paesi europei dispongono già di tali quadri; alcune costituzioni limitano rigorosamente l’impiego sul territorio nazionale. Chiediamo un dibattito democratico aperto all’interno di ciascun Paese, nel rispetto delle sue regole costituzionali, e non che tali regole vengano aggirate.

  - q: "Perché alcune proposte riguardano solo chi non è cittadino?"
    a: |
      Il diritto penale si applica allo stesso modo a chiunque commetta violenze, indipendentemente dalla nazionalità, e la petizione chiede che tutti i responsabili siano perseguiti in modo coerente. Le proposte 4 e 5 riguardano il soggiorno, il rimpatrio e i divieti d’ingresso, conseguenze che per legge possono applicarsi solo ai non cittadini. Per questo sono formulate così.

      La petizione non sostiene che i disordini siano causati principalmente da stranieri e non deve essere usata per stigmatizzare alcun gruppo. Ogni decisione deve basarsi sul comportamento individuale della persona, accertato attraverso un giusto processo, e mai sulla nazionalità, sull’origine, sull’origine etnica o sulla religione.

  - q: "È legale trattenere le persone prima di una decisione definitiva?"
    a: |
      La detenzione è legittima solo sulla base di una previsione di legge e con controllo giurisdizionale, come richiesto dall’articolo 5 della Convenzione europea dei diritti dell’uomo. Ciò comprende la detenzione degli indagati nei procedimenti penali e, per le persone prive di un titolo di soggiorno, il trattenimento finalizzato al rimpatrio ai sensi della direttiva rimpatri dell’UE.

      La petizione chiede che, entro queste regole, tali persone possano essere trattenute temporaneamente in strutture semplici ma dignitose, conformi agli standard europei, con accesso a un avvocato, diritto di contestare il trattenimento dinanzi a un giudice e limiti di durata rigorosi.

  - q: "Qualcuno potrebbe essere rimandato in un Paese in cui sarebbe in pericolo?"
    a: |
      No. Il principio di non respingimento è assoluto: nessuno può essere rimpatriato in un Paese in cui rischierebbe realmente la tortura, trattamenti inumani o degradanti, o persecuzioni. La petizione lo rispetta espressamente. Ogni decisione di rimpatrio deve essere preceduta da una valutazione individuale e può essere impugnata dinanzi a un giudice.

  - q: "E i cittadini di altri Paesi dell’UE?"
    a: |
      I cittadini dell’UE godono della libera circolazione, che può essere limitata solo per motivi di ordine pubblico o di pubblica sicurezza e a condizioni rigorose stabilite dal diritto dell’UE (direttiva 2004/38/CE): la decisione deve basarsi sul comportamento personale dell’interessato, che deve rappresentare una minaccia reale, attuale e sufficientemente grave, e deve essere proporzionata. La petizione chiede che queste regole esistenti siano applicate in modo coerente, non che vengano modificate.

  - q: "La legge vigente non consente già gran parte di tutto questo?"
    a: |
      In molti Paesi, in parte sì. Molti degli strumenti che citiamo, come il sistema d’informazione Schengen, le norme sul soggiorno per motivi di ordine pubblico o i quadri per l’assistenza militare, esistono già in una qualche forma. Nella pratica vengono spesso applicati in modo incoerente, lento o senza risorse adeguate, e le regole differiscono molto da un Paese all’altro.

      La petizione chiede ai decisori di colmare le lacune, di stabilire quadri chiari dove mancano e di applicare le regole esistenti in modo coerente ed equo. Preferiamo dirlo apertamente piuttosto che fingere che tutto debba essere inventato da zero.

  - q: "I manifestanti pacifici potrebbero essere trattati per errore come facinorosi?"
    a: |
      Questo rischio è reale, ed è per questo che la petizione insiste sulle garanzie: una valutazione individuale del comportamento di ciascuna persona, prove che reggano in tribunale, controllo giurisdizionale, controllo indipendente sull’operato della polizia e diritto a un ricorso effettivo. La semplice presenza a una riunione in cui si verificano violenze non deve mai essere considerata, di per sé, un reato.

  - q: "Che cosa succede alla mia firma?"
    a: |
      Il suo nome e il suo Paese sono archiviati in modo sicuro e non vengono mai pubblicati. Quando la petizione viene consegnata, comunichiamo il numero totale di firme e il numero per Paese, non i nomi. Il suo indirizzo e-mail, se lo ha fornito, viene utilizzato solo per evitare duplicati e, se lo ha richiesto, per inviarle alcuni aggiornamenti.

      Tutte le firme vengono cancellate al più tardi sei mesi dopo la consegna della petizione. Per i dettagli si veda l’informativa sulla privacy.

  - q: "Posso ritirare la mia firma?"
    a: |
      Sì, in qualsiasi momento. Dopo aver firmato riceve un codice di ritiro personale. Lo inserisca nella pagina di ritiro e la sua firma verrà cancellata immediatamente. Se ha smarrito il codice, scriva a privacy@public-order.eu ed esamineremo la sua richiesta entro un mese.

  - q: "Chi può firmare?"
    a: |
      Chiunque abbia almeno 16 anni e sostenga la petizione; accogliamo con particolare favore i residenti dei Paesi dell’UE e del SEE. La preghiamo di firmare una sola volta e con il suo vero nome. Le firme palesemente false o offensive vengono rimosse.

  - q: "Perché dovrei fidarmi di una petizione senza organizzatori con nome e cognome?"
    a: |
      È una domanda legittima. Poiché l’argomento è politicamente delicato, non pubblichiamo i nomi né gli indirizzi dei singoli organizzatori, per tutelarne la sicurezza. Pubblichiamo invece tutto ciò che serve per giudicarci: il testo integrale, i nostri impegni e le nostre regole sulla privacy. Può ritirare la firma in qualsiasi momento e siamo sempre raggiungibili via e-mail. Chiediamo di essere giudicati per ciò che proponiamo e per come trattiamo i suoi dati.
