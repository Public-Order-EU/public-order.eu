items:
  - q: Kes on selle petitsiooni taga?
    a: |
      European Public Order Initiative’i korraldavad ühiselt mitme Euroopa riigi kodanikud ja elanikud. Oleme sõltumatud ega ole seotud ühegi erakonna, valitsuse, ettevõtte ega ELi institutsiooniga.

      Esitame petitsiooni teadlikult kollektiivselt, ilma üksikute pressiesindajateta, et arutelu keskenduks ettepanekutele, mitte isikutele. Kaasatud inimeste turvalisuse huvides me üksikute korraldajate nimesid ega aadresse ei avalda. Korraldajad vastutavad petitsiooni ja teie andmete eest ning nendega saab alati ühendust võtta (vt õigusteavet).

  - q: "Kas see on ametlik Euroopa kodanikualgatus?"
    a: |
      Ei. Ametlik Euroopa kodanikualgatus tuleb registreerida Euroopa Komisjonis ja allkirju tuleb koguda määrusega (EL) 2019/788 kehtestatud rangete reeglite kohaselt. See on sõltumatu petitsioon, mis näitab avalikku toetust ja antakse üle otsustajatele.

      Siin kogutud allkirju ei saa arvestada ametliku Euroopa kodanikualgatuse allkirjadena. Kui korraldajad peaksid kunagi mõne algatuse registreerima, ütleme seda selgelt ja selgitame, kuidas seda allkirjastada.

  - q: "Kas te tegelikult ei püüa piirata õigust protestida?"
    a: |
      Ei. Petitsiooni esimene nõue on kaitsta rahumeelset protesti – ka protesti, millega me ei pruugi nõustuda. Usume, et vägivald on selle õiguse üks suurimaid ohte: see ohustab rahumeelseid osalejaid, diskrediteerib nende eesmärki ja seda tuuakse sageli argumendina meeleavalduste üldiseks piiramiseks.

      Petitsioon on suunatud konkreetsete vägivallaaktide – süütamise, rüüstamise ning inimeste või vara vastu suunatud rünnakute – vastu, mitte ühegi rühma vaadete vastu. Iga meede peab austama kogunemisvabadust, mida kaitseb Euroopa inimõiguste konventsiooni artikkel 11.

  - q: "Kas sõjaväe kasutamine avaliku korra tagamiseks ei ohusta demokraatiat?"
    a: |
      See on tõsine mure ja ajalugu annab ettevaatlikkuseks head põhjust. Just seetõttu toetab petitsioon sõjaväe abi ainult viimase abinõuna, kui politseivõimekus on selgelt ülekoormatud, ja ainult rangetel tingimustel: parlamendi poolt eelnevalt vastu võetud õigusraamistik, tsiviilasutuste otsus, parlamentaarne järelevalve, ajalised piirangud, politsei juhtimine, peamiselt toetavad ülesanded ning mitte kunagi rahumeelsete kogunemiste vastu.

      Mitmes Euroopa riigis selline raamistik juba on; mõned põhiseadused piiravad riigisisest kasutamist rangelt. Me palume avatud demokraatlikku arutelu iga riigi põhiseaduslike reeglite piires – mitte nende reeglite kõrvalehoidmist.

  - q: Miks mõned ettepanekud puudutavad ainult mittekodanikke?
    a: |
      Kriminaalõigus kehtib võrdselt kõigile, kes vägivalda toime panevad, olenemata kodakondsusest, ja petitsioon nõuab kõigi õigusrikkujate järjekindlat süüdistuse alla võtmist. Ettepanekud 4 ja 5 puudutavad elamisõigust, tagasisaatmist ja sissesõidukeelde – tagajärgi, mida saab seaduse järgi kohaldada ainult mittekodanikele. Seetõttu on need just nii sõnastatud.

      Petitsioon ei väida, et rahutuste peamised põhjustajad on välismaalased, ning seda ei tohi kasutada ühegi rühma häbimärgistamiseks. Iga otsus peab põhinema isiku enda käitumisel, mis on tuvastatud nõuetekohases menetluses – mitte kunagi kodakondsusel, päritolul, etnilisel kuuluvusel ega usul.

  - q: Kas inimesi on seaduslik kinni pidada enne lõplikku otsust?
    a: |
      Kinnipidamine on seaduslik ainult seaduses sätestatud alusel ja kohtuliku järelevalve all, nagu nõuab Euroopa inimõiguste konventsiooni artikkel 5. See hõlmab kahtlustatavate kinnipidamist kriminaalmenetluses ning seadusliku elamisõiguseta isikute puhul kinnipidamist tagasisaatmise eesmärgil vastavalt ELi tagasisaatmisdirektiivile.

      Petitsioon palub, et nende reeglite raames saaks selliseid isikuid ajutiselt pidada lihtsates, kuid inimlikes, Euroopa standarditele vastavates tingimustes – koos juurdepääsuga advokaadile, õigusega vaidlustada kinnipidamine kohtus ja rangete ajapiirangutega.

  - q: Kas kedagi võidakse saata tagasi riiki, kus ta oleks ohus?
    a: |
      Ei. Tagasisaatmise keelu põhimõte on absoluutne: kedagi ei tohi tagasi saata riiki, kus teda ohustaks tegelik piinamise, ebainimliku või alandava kohtlemise või tagakiusamise oht. Petitsioon austab seda sõnaselgelt. Iga tagasisaatmise otsus peab põhinema üksikjuhtumi hindamisel ja seda saab kohtus vaidlustada.

  - q: Mis saab teiste ELi riikide kodanikest?
    a: |
      ELi kodanikel on vaba liikumise õigus, mida saab piirata ainult avaliku korra või avaliku julgeoleku põhjustel ELi õiguses (direktiiv 2004/38/EÜ) sätestatud rangetel tingimustel: otsus peab põhinema isiku enda käitumisel, mis peab kujutama endast tegelikku, olemasolevat ja piisavalt tõsist ohtu, ning olema proportsionaalne. Petitsioon palub neid kehtivaid reegleid järjekindlalt kohaldada – mitte neid muuta.

  - q: Kas kehtiv õigus ei võimalda juba suurt osa sellest?
    a: |
      Paljudes riikides osaliselt küll. Paljud meie nimetatud vahendid – näiteks Schengeni infosüsteem, avaliku korraga seotud elamisõiguse reeglid või sõjaväelise abi raamistikud – on mingil kujul juba olemas. Praktikas kohaldatakse neid sageli ebajärjekindlalt, aeglaselt või piisavate ressurssideta ning riikide reeglid erinevad suuresti.

      Petitsioon palub otsustajatel kõrvaldada lüngad, kehtestada selged raamistikud seal, kus need puuduvad, ning kohaldada kehtivaid reegleid järjekindlalt ja õiglaselt. Ütleme seda pigem avalikult, kui teeskleme, et kõik tuleb nullist välja mõelda.

  - q: Kas rahumeelseid meeleavaldajaid võidakse ekslikult kohelda korrarikkujatena?
    a: |
      See oht on reaalne ja seetõttu nõuab petitsioon tagatisi: iga isiku käitumise individuaalset hindamist, kohtus vastu pidavaid tõendeid, kohtulikku kontrolli, politsei sõltumatut järelevalvet ja õigust tõhusale õiguskaitsevahendile. Viibimist kogunemisel, kus toimub vägivalda, ei tohi iseenesest kunagi käsitada õigusrikkumisena.

  - q: Mis saab minu allkirjast?
    a: |
      Teie nimi ja riik salvestatakse turvaliselt ning neid ei avaldata kunagi. Petitsiooni üleandmisel esitame allkirjade koguarvu ja arvu riikide kaupa – mitte nimesid. Teie e-posti aadressi, kui selle esitasite, kasutatakse ainult korduvate allkirjade vältimiseks ja – kui seda soovisite – paari teavituse saatmiseks.

      Kõik allkirjad kustutatakse hiljemalt kuus kuud pärast petitsiooni üleandmist. Üksikasjad leiate privaatsuspoliitikast.

  - q: Kas ma saan oma allkirja tagasi võtta?
    a: |
      Jah, igal ajal. Pärast allkirjastamist saate isikliku tagasivõtmiskoodi. Sisestage see tagasivõtmise lehel ja teie allkiri kustutatakse kohe. Kui olete koodi kaotanud, kirjutage aadressile privacy@public-order.eu ja käsitleme teie taotlust ühe kuu jooksul.

  - q: Kes saab allkirjastada?
    a: |
      Igaüks, kes on vähemalt 16-aastane ja petitsiooni toetab – eriti on teretulnud ELi ja EMP riikide elanikud. Allkirjastage palun ainult üks kord ja oma tegeliku nimega. Ilmselgelt võltsitud või solvavad allkirjad eemaldatakse.

  - q: Miks peaksin usaldama petitsiooni, millel pole nimetatud korraldajaid?
    a: |
      Õiglane küsimus. Kuna teema on poliitiliselt tundlik, ei avalda me üksikute korraldajate nimesid ega aadresse nende turvalisuse kaitseks. Avaldame aga kõik, mida on vaja meie hindamiseks: täistekst, meie kohustused ja privaatsusreeglid. Oma allkirja saate igal ajal tagasi võtta ning meiega saab alati e-posti teel ühendust võtta. Palume hinnata meid selle järgi, mida pakume ja kuidas teie andmeid käsitleme.
