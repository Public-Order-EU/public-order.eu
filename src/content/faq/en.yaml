items:
  - q: Who is behind this petition?
    a: |
      The European Public Order Initiative is organised collectively by citizens and residents of several European countries, We are independent and not affiliated with any political party, government, company or EU institution.

      We deliberately present the petition collectively, without individual spokespeople, so that the discussion stays focused on the proposals rather than on personalities. For the safety of the people involved, we do not publish the names or addresses of individual organisers. The organisers are responsible for the petition and for your data, and can always be contacted (see the legal notice).

  - q: Is this an official European Citizens' Initiative?
    a: |
      No. An official European Citizens' Initiative (ECI) must be registered with the European Commission and collect signatures under strict rules set by Regulation (EU) 2019/788. This is an independent petition that shows public support and is handed over to decision-makers.

      Signatures collected here cannot be counted towards an official ECI. If the organisers ever register one, we will say so clearly and explain how to sign it.

  - q: Aren't you really trying to restrict the right to protest?
    a: |
      No. The first demand of the petition is to protect peaceful protest — including protest we may disagree with. We believe that violence is one of the biggest threats to that right: it endangers peaceful participants, discredits their cause, and is often used as an argument to restrict demonstrations altogether.

      The petition is aimed at specific violent acts — arson, looting and attacks on people or property — not at the views of any group. Every measure must respect the freedom of assembly protected by Article 11 of the European Convention on Human Rights.

  - q: Isn't using the military for public order dangerous for democracy?
    a: |
      It is a serious concern, and history gives good reasons for caution. That is exactly why the petition only supports military assistance as a last resort, when police capacity is demonstrably overwhelmed, and only under strict conditions: a legal framework adopted in advance by parliament, a decision by the civilian authorities, parliamentary oversight, time limits, police leadership, mainly supporting tasks, and never against peaceful assemblies.

      Several European countries already have such frameworks; some constitutions strictly limit domestic deployment. We ask for an open democratic debate within each country's constitutional rules — not for those rules to be bypassed.

  - q: Why do some proposals only concern people who are not citizens?
    a: |
      Criminal law applies equally to everyone who commits violence, whatever their nationality, and the petition asks for consistent prosecution of all offenders. Proposals 4 and 5 concern residence, return and entry bans — consequences that, by law, can only apply to non-citizens. That is why they are worded that way.

      The petition does not claim that riots are caused mainly by foreigners, and it must not be used to stigmatise any group. Every decision must be based on an individual's own conduct, established through due process — never on nationality, origin, ethnicity or religion.

  - q: Is it lawful to detain people before a final decision?
    a: |
      Detention is only lawful on a basis provided by law and with judicial supervision, as required by Article 5 of the European Convention on Human Rights. That includes detention of suspects in criminal proceedings and, for people without legal residence, detention with a view to return under the EU Return Directive.

      The petition asks that, within these rules, such people can be held temporarily in simple but humane facilities that meet European standards — with access to a lawyer, the right to challenge detention before a court, and strict time limits.

  - q: Could someone be sent back to a country where they would be in danger?
    a: |
      No. The principle of non-refoulement is absolute: nobody may be returned to a country where they would face a real risk of torture, inhuman or degrading treatment, or persecution. The petition explicitly respects this. Every return decision must follow an individual assessment and can be challenged in court.

  - q: What about citizens of other EU countries?
    a: |
      EU citizens enjoy free movement, which can only be restricted on grounds of public policy or public security under strict conditions set by EU law (Directive 2004/38/EC): the decision must be based on the person's own conduct, which must represent a genuine, present and sufficiently serious threat, and must be proportionate. The petition asks for these existing rules to be applied consistently — not for them to be changed.

  - q: Doesn't existing law already allow most of this?
    a: |
      In many countries, partly yes. Many of the tools we mention — such as the Schengen Information System, residence rules on public-order grounds, or frameworks for military assistance — already exist in some form. In practice they are often applied inconsistently, slowly, or without adequate resources, and rules differ widely between countries.

      The petition asks decision-makers to close gaps, set clear frameworks where they are missing, and apply existing rules consistently and fairly. We prefer to say this openly rather than pretend that everything has to be invented from scratch.

  - q: Could peaceful protesters be wrongly treated as rioters?
    a: |
      That risk is real, and it is why the petition insists on safeguards: an individual assessment of each person's conduct, evidence that stands up in court, judicial review, independent oversight of the police and the right to an effective remedy. Being present at an assembly where violence occurs must never by itself be treated as an offence.

  - q: What happens to my signature?
    a: |
      Your name and country are stored securely and are never published. When the petition is handed over, we report the total number of signatures and the number per country — not names. Your e-mail address, if you gave it, is used only to prevent duplicates and, if you asked for it, to send you a few updates.

      All signatures are deleted at the latest six months after the petition has been handed over. See the privacy policy for details.

  - q: Can I withdraw my signature?
    a: |
      Yes, at any time. After signing, you receive a personal withdrawal code. Enter it on the withdrawal page and your signature is deleted immediately. If you have lost the code, write to privacy@public-order.eu and we will handle your request within one month.

  - q: Who can sign?
    a: |
      Anyone aged 16 or over who supports the petition — we especially welcome residents of EU and EEA countries. Please sign only once and with your real name. Signatures that are obviously fake or offensive are removed.

  - q: Why should I trust a petition without named organisers?
    a: |
      A fair question. Because the subject is politically sensitive, we do not publish the names or addresses of individual organisers, to protect their safety. What we do publish is everything you need to judge us: our full text, our commitments and our privacy rules. You can withdraw your signature at any time, and we can always be reached by e-mail. We ask to be judged on what we propose and how we handle your data.
