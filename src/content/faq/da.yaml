items:
  - q: "Hvem står bag denne underskriftindsamling?"
    a: |
      European Public Order Initiative er organiseret kollektivt af borgere og beboere i flere europæiske lande. Vi er uafhængige og har ingen tilknytning til noget politisk parti, nogen regering, nogen virksomhed eller nogen EU-institution.

      Vi har bevidst valgt at præsentere underskriftindsamlingen kollektivt, uden enkelte talspersoner, så debatten handler om forslagene frem for om personer. Af hensyn til de involveredes sikkerhed offentliggør vi ikke navne eller adresser på de enkelte initiativtagere. Initiativtagerne er ansvarlige for underskriftindsamlingen og for dine oplysninger og kan altid kontaktes (se den juridiske meddelelse).

  - q: "Er dette et officielt europæisk borgerinitiativ?"
    a: |
      Nej. Et officielt europæisk borgerinitiativ (EBI) skal registreres hos Europa-Kommissionen og indsamle underskrifter efter de strenge regler i forordning (EU) 2019/788. Dette er en uafhængig underskriftindsamling, der viser den offentlige opbakning og overrækkes til beslutningstagere.

      Underskrifter, der indsamles her, kan ikke tælle med i et officielt EBI. Hvis initiativtagerne en dag registrerer et, vil vi sige det tydeligt og forklare, hvordan du kan skrive under på det.

  - q: "Forsøger I ikke i virkeligheden at indskrænke retten til at demonstrere?"
    a: |
      Nej. Underskriftindsamlingens første krav er at beskytte fredelig demonstration – også demonstrationer, vi måske er uenige i. Vi mener, at vold er en af de største trusler mod denne ret: den bringer fredelige deltagere i fare, miskrediterer deres sag og bruges ofte som argument for at begrænse demonstrationer helt.

      Underskriftindsamlingen retter sig mod konkrete voldelige handlinger – brandstiftelse, plyndring og angreb på mennesker eller ejendom – ikke mod nogen gruppes synspunkter. Enhver foranstaltning skal respektere den forsamlingsfrihed, der er beskyttet af artikel 11 i Den Europæiske Menneskerettighedskonvention.

  - q: "Er det ikke farligt for demokratiet at bruge militæret til at opretholde den offentlige orden?"
    a: |
      Det er en alvorlig bekymring, og historien giver god grund til forsigtighed. Netop derfor støtter underskriftindsamlingen kun militær bistand som en sidste udvej, når politiets kapacitet påviseligt er overbelastet, og kun på strenge betingelser: en retlig ramme, som parlamentet på forhånd har vedtaget, en beslutning truffet af de civile myndigheder, parlamentarisk kontrol, tidsbegrænsning, politiets ledelse, hovedsagelig støtteopgaver og aldrig mod fredelige forsamlinger.

      Flere europæiske lande har allerede sådanne rammer; nogle forfatninger sætter strenge grænser for indsættelse i eget land. Vi beder om en åben demokratisk debat inden for hvert lands forfatningsmæssige regler – ikke om at omgå dem.

  - q: "Hvorfor vedrører nogle forslag kun personer, der ikke er statsborgere?"
    a: |
      Straffeloven gælder ens for alle, der udøver vold, uanset nationalitet, og underskriftindsamlingen kræver, at alle gerningspersoner retsforfølges konsekvent. Forslag 4 og 5 handler om ophold, udsendelse og indrejseforbud – konsekvenser, som ifølge loven kun kan ramme personer, der ikke er statsborgere. Derfor er de formuleret sådan.

      Underskriftindsamlingen påstår ikke, at uroligheder hovedsagelig skyldes udlændinge, og den må ikke bruges til at stigmatisere nogen gruppe. Enhver afgørelse skal bygge på den enkeltes egen adfærd, fastslået gennem en retfærdig proces – aldrig på nationalitet, oprindelse, etnicitet eller religion.

  - q: "Er det lovligt at tilbageholde personer, før der foreligger en endelig afgørelse?"
    a: |
      Tilbageholdelse er kun lovlig, hvis den har hjemmel i loven og er underlagt domstolskontrol, som det kræves i artikel 5 i Den Europæiske Menneskerettighedskonvention. Det omfatter varetægtsfængsling af mistænkte i straffesager og, for personer uden lovligt ophold, tilbageholdelse med henblik på udsendelse i henhold til EU's returdirektiv.

      Underskriftindsamlingen beder om, at sådanne personer inden for disse regler midlertidigt kan tilbageholdes i enkle, men humane faciliteter, der opfylder europæiske standarder – med adgang til en advokat, ret til at få tilbageholdelsen prøvet ved en domstol og strenge tidsfrister.

  - q: "Kan nogen blive sendt tilbage til et land, hvor de vil være i fare?"
    a: |
      Nej. Non-refoulement-princippet er absolut: ingen må udsendes til et land, hvor de risikerer tortur, umenneskelig eller nedværdigende behandling eller forfølgelse. Underskriftindsamlingen respekterer udtrykkeligt dette. Enhver afgørelse om udsendelse skal bygge på en individuel vurdering og kan indbringes for en domstol.

  - q: "Hvad med statsborgere i andre EU-lande?"
    a: |
      EU-borgere har ret til fri bevægelighed, som kun kan begrænses af hensyn til den offentlige orden eller den offentlige sikkerhed på strenge betingelser fastsat i EU-retten (direktiv 2004/38/EF): afgørelsen skal bygge på personens egen adfærd, som skal udgøre en reel, aktuel og tilstrækkelig alvorlig trussel, og den skal være forholdsmæssig. Underskriftindsamlingen beder om, at disse eksisterende regler anvendes konsekvent – ikke om, at de ændres.

  - q: "Tillader den gældende lovgivning ikke allerede det meste af dette?"
    a: |
      I mange lande delvist, ja. Mange af de redskaber, vi nævner – såsom Schengeninformationssystemet, opholdsregler af hensyn til den offentlige orden eller rammer for militær bistand – findes allerede i en eller anden form. I praksis anvendes de ofte uens, langsomt eller uden tilstrækkelige ressourcer, og reglerne varierer meget fra land til land.

      Underskriftindsamlingen beder beslutningstagerne om at lukke huller, fastsætte klare rammer, hvor de mangler, og anvende de eksisterende regler konsekvent og retfærdigt. Vi vil hellere sige det åbent end foregive, at alt skal opfindes fra bunden.

  - q: "Kan fredelige demonstranter blive fejlagtigt behandlet som uromagere?"
    a: |
      Den risiko er reel, og derfor insisterer underskriftindsamlingen på sikkerhedsgarantier: en individuel vurdering af hver persons adfærd, beviser, der holder i retten, domstolsprøvelse, uafhængigt tilsyn med politiet og ret til effektive retsmidler. At være til stede ved en forsamling, hvor der forekommer vold, må aldrig i sig selv behandles som en lovovertrædelse.

  - q: "Hvad sker der med min underskrift?"
    a: |
      Dit navn og dit land gemmes sikkert og bliver aldrig offentliggjort. Når underskriftindsamlingen overrækkes, indberetter vi det samlede antal underskrifter og antallet pr. land – ikke navne. Din e-mailadresse, hvis du har oplyst den, bruges kun til at forhindre dobbelte underskrifter og, hvis du har bedt om det, til at sende dig et par opdateringer.

      Alle underskrifter slettes senest seks måneder efter, at underskriftindsamlingen er overrakt. Se privatlivspolitikken for flere oplysninger.

  - q: "Kan jeg trække min underskrift tilbage?"
    a: |
      Ja, til enhver tid. Når du har skrevet under, får du en personlig tilbagetrækningskode. Indtast den på siden til tilbagetrækning, så bliver din underskrift slettet med det samme. Hvis du har mistet koden, kan du skrive til privacy@public-order.eu, så behandler vi din anmodning inden for en måned.

  - q: "Hvem kan skrive under?"
    a: |
      Alle på 16 år eller derover, der støtter underskriftindsamlingen – vi byder især beboere i EU- og EØS-lande velkommen. Skriv kun under én gang og med dit rigtige navn. Underskrifter, der er åbenlyst falske eller stødende, fjernes.

  - q: "Hvorfor skal jeg stole på en underskriftindsamling uden navngivne initiativtagere?"
    a: |
      Et fair spørgsmål. Fordi emnet er politisk følsomt, offentliggør vi ikke navne eller adresser på de enkelte initiativtagere for at beskytte deres sikkerhed. Det, vi offentliggør, er alt, hvad du har brug for for at bedømme os: vores fulde tekst, vores tilsagn og vores regler for privatlivets fred. Du kan til enhver tid trække din underskrift tilbage, og du kan altid kontakte os på e-mail. Vi beder om at blive bedømt på det, vi foreslår, og på hvordan vi behandler dine oplysninger.
