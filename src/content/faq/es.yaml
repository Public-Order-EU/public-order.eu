items:
  - q: ¿Quién está detrás de esta petición?
    a: |
      La European Public Order Initiative está organizada colectivamente por ciudadanos y residentes de varios países europeos. Somos independientes y no estamos vinculados a ningún partido político, gobierno, empresa ni institución de la UE.

      Presentamos deliberadamente la petición de forma colectiva, sin portavoces individuales, para que el debate se centre en las propuestas y no en las personas. Por la seguridad de las personas implicadas, no publicamos los nombres ni las direcciones de cada uno de los organizadores. Los organizadores son responsables de la petición y de sus datos, y siempre es posible ponerse en contacto con ellos (véase el aviso legal).

  - q: ¿Es una Iniciativa Ciudadana Europea oficial?
    a: |
      No. Una Iniciativa Ciudadana Europea (ICE) oficial debe estar registrada en la Comisión Europea y recoger firmas con arreglo a las estrictas normas del Reglamento (UE) 2019/788. Esta es una petición independiente que muestra el apoyo de la ciudadanía y se entrega a los responsables de las decisiones.

      Las firmas recogidas aquí no pueden contabilizarse para una ICE oficial. Si los organizadores llegaran a registrar una, lo diremos con claridad y explicaremos cómo firmarla.

  - q: ¿No intentan en realidad restringir el derecho a la protesta?
    a: |
      No. La primera petición del texto es proteger la protesta pacífica, incluso aquella con la que podamos discrepar. Creemos que la violencia es una de las mayores amenazas para ese derecho: pone en peligro a los participantes pacíficos, desacredita su causa y se utiliza con frecuencia como argumento para restringir las manifestaciones en su conjunto.

      La petición se dirige contra actos violentos concretos (incendios provocados, saqueos y agresiones a personas o bienes), no contra las opiniones de ningún grupo. Toda medida debe respetar la libertad de reunión protegida por el artículo 11 del Convenio Europeo de Derechos Humanos.

  - q: ¿No es peligroso para la democracia emplear al ejército en el orden público?
    a: |
      Es una preocupación seria, y la historia ofrece buenas razones para la cautela. Precisamente por eso la petición solo apoya la asistencia militar como último recurso, cuando la capacidad policial se vea claramente desbordada, y solo en condiciones estrictas: un marco jurídico adoptado de antemano por el parlamento, una decisión de las autoridades civiles, control parlamentario, límites temporales, dirección policial, tareas principalmente de apoyo y nunca contra reuniones pacíficas.

      Varios países europeos ya cuentan con marcos de este tipo; algunas constituciones limitan estrictamente el despliegue en el interior del país. Pedimos un debate democrático abierto dentro de las normas constitucionales de cada país, no que se eludan esas normas.

  - q: ¿Por qué algunas propuestas solo afectan a personas que no son nacionales?
    a: |
      El Derecho penal se aplica por igual a todo el que comete actos de violencia, sea cual sea su nacionalidad, y la petición reclama que se persiga de manera coherente a todos los infractores. Las propuestas 4 y 5 se refieren a la residencia, el retorno y las prohibiciones de entrada: consecuencias que, por ley, solo pueden aplicarse a quienes no son nacionales. Por eso están formuladas así.

      La petición no afirma que los disturbios los causen principalmente extranjeros y no debe utilizarse para estigmatizar a ningún grupo. Toda decisión debe basarse en la conducta propia de cada persona, establecida mediante el procedimiento debido, y nunca en la nacionalidad, el origen, la etnia o la religión.

  - q: ¿Es legal detener a personas antes de que haya una decisión definitiva?
    a: |
      La detención solo es lícita cuando está prevista por la ley y se somete a control judicial, como exige el artículo 5 del Convenio Europeo de Derechos Humanos. Esto incluye la detención de sospechosos en procesos penales y, en el caso de las personas sin residencia legal, la detención con vistas al retorno con arreglo a la Directiva de retorno de la UE.

      La petición pide que, dentro de estas normas, dichas personas puedan ser retenidas temporalmente en instalaciones sencillas pero humanas que cumplan las normas europeas, con acceso a un abogado, derecho a recurrir la detención ante un tribunal y plazos estrictos.

  - q: ¿Podría devolverse a alguien a un país donde correría peligro?
    a: |
      No. El principio de no devolución es absoluto: nadie puede ser devuelto a un país en el que corra un riesgo real de tortura, de trato inhumano o degradante, o de persecución. La petición lo respeta de forma expresa. Toda decisión de retorno debe basarse en una evaluación individual y puede recurrirse ante los tribunales.

  - q: ¿Qué ocurre con los ciudadanos de otros países de la UE?
    a: |
      Los ciudadanos de la UE disfrutan de libre circulación, que solo puede restringirse por razones de orden público o de seguridad pública, en las estrictas condiciones fijadas por el Derecho de la Unión (Directiva 2004/38/CE): la decisión debe basarse en la conducta personal del interesado, que debe representar una amenaza real, actual y suficientemente grave, y debe ser proporcionada. La petición pide que estas normas ya existentes se apliquen de manera coherente, no que se modifiquen.

  - q: ¿No permite ya la legislación vigente la mayor parte de esto?
    a: |
      En muchos países, en parte sí. Muchas de las herramientas que mencionamos, como el Sistema de Información de Schengen, las normas de residencia por motivos de orden público o los marcos de asistencia militar, ya existen de alguna forma. En la práctica, a menudo se aplican de manera incoherente, lenta o sin recursos suficientes, y las normas difieren mucho de un país a otro.

      La petición pide a los responsables de las decisiones que cubran las lagunas, establezcan marcos claros donde falten y apliquen las normas existentes de manera coherente y justa. Preferimos decirlo abiertamente antes que fingir que todo hay que inventarlo desde cero.

  - q: ¿Podría tratarse por error a manifestantes pacíficos como alborotadores?
    a: |
      Ese riesgo es real, y por eso la petición insiste en las garantías: una evaluación individual de la conducta de cada persona, pruebas que resistan ante un tribunal, control judicial, supervisión independiente de la policía y derecho a un recurso efectivo. Estar presente en una reunión en la que se produce violencia nunca debe considerarse, por sí solo, un delito.

  - q: ¿Qué ocurre con mi firma?
    a: |
      Su nombre y su país se almacenan de forma segura y nunca se publican. Cuando se entrega la petición, comunicamos el número total de firmas y el número por país, no los nombres. Su dirección de correo electrónico, si la ha facilitado, se utiliza únicamente para evitar duplicados y, si lo ha solicitado, para enviarle algunas informaciones.

      Todas las firmas se eliminan, a más tardar, seis meses después de la entrega de la petición. Consulte la política de privacidad para más detalles.

  - q: ¿Puedo retirar mi firma?
    a: |
      Sí, en cualquier momento. Tras firmar, recibe un código personal de retirada. Introdúzcalo en la página de retirada y su firma se eliminará de inmediato. Si ha perdido el código, escriba a privacy@public-order.eu y atenderemos su solicitud en el plazo de un mes.

  - q: ¿Quién puede firmar?
    a: |
      Cualquier persona de 16 años o más que apoye la petición; damos una especial bienvenida a los residentes de países de la UE y del EEE. Firme solo una vez y con su nombre real. Las firmas claramente falsas u ofensivas se eliminan.

  - q: ¿Por qué debería confiar en una petición sin organizadores con nombre?
    a: |
      Es una pregunta razonable. Como el tema es políticamente delicado, no publicamos los nombres ni las direcciones de cada uno de los organizadores, para proteger su seguridad. Lo que sí publicamos es todo lo que necesita para juzgarnos: nuestro texto completo, nuestros compromisos y nuestras normas de privacidad. Puede retirar su firma en cualquier momento y siempre se puede contactar con nosotros por correo electrónico. Pedimos que se nos juzgue por lo que proponemos y por cómo tratamos sus datos.
