items:
  - q: "Qui est à l’origine de cette pétition ?"
    a: |
      La European Public Order Initiative est organisée collectivement par des citoyens et des résidents de plusieurs pays européens. Nous sommes indépendants et nous ne sommes affiliés à aucun parti politique, gouvernement, entreprise ou institution de l’UE.

      Nous présentons délibérément la pétition de manière collective, sans porte-parole individuels, afin que le débat reste centré sur les propositions plutôt que sur les personnes. Pour la sécurité des personnes concernées, nous ne publions ni les noms ni les adresses des organisateurs à titre individuel. Les organisateurs sont responsables de la pétition et de vos données, et peuvent toujours être contactés (voir les mentions légales).

  - q: "S’agit-il d’une initiative citoyenne européenne officielle ?"
    a: |
      Non. Une initiative citoyenne européenne (ICE) officielle doit être enregistrée auprès de la Commission européenne et recueillir des signatures selon les règles strictes fixées par le règlement (UE) 2019/788. Ceci est une pétition indépendante, qui montre le soutien du public et est remise aux décideurs.

      Les signatures recueillies ici ne peuvent pas être comptabilisées pour une ICE officielle. Si les organisateurs en enregistrent un jour une, nous le dirons clairement et expliquerons comment la signer.

  - q: "N’essayez-vous pas, en réalité, de restreindre le droit de manifester ?"
    a: |
      Non. La première demande de la pétition est de protéger la manifestation pacifique, y compris celle avec laquelle nous pourrions être en désaccord. Nous pensons que la violence est l’une des plus grandes menaces pesant sur ce droit : elle met en danger les participants pacifiques, discrédite leur cause et sert souvent d’argument pour restreindre purement et simplement les manifestations.

      La pétition vise des actes violents précis (incendies volontaires, pillages, agressions contre des personnes ou des biens), et non les opinions d’un groupe quel qu’il soit. Chaque mesure doit respecter la liberté de réunion protégée par l’article 11 de la Convention européenne des droits de l’homme.

  - q: "Recourir à l’armée pour maintenir l’ordre public n’est-il pas dangereux pour la démocratie ?"
    a: |
      C’est une préoccupation sérieuse, et l’histoire donne de bonnes raisons d’être prudent. C’est précisément pourquoi la pétition n’envisage l’assistance militaire qu’en dernier recours, lorsque les capacités de la police sont manifestement dépassées, et seulement à des conditions strictes : un cadre juridique adopté au préalable par le parlement, une décision des autorités civiles, un contrôle parlementaire, des limites de durée, la direction de la police, des missions principalement d’appui, et jamais contre des rassemblements pacifiques.

      Plusieurs pays européens disposent déjà de tels cadres ; certaines constitutions limitent strictement le déploiement sur le territoire national. Nous demandons un débat démocratique ouvert dans chaque pays, dans le respect de ses règles constitutionnelles, et non que ces règles soient contournées.

  - q: "Pourquoi certaines propositions ne concernent-elles que les personnes qui ne sont pas ressortissantes du pays ?"
    a: |
      Le droit pénal s’applique de la même manière à toute personne qui commet des violences, quelle que soit sa nationalité, et la pétition demande que tous les auteurs soient poursuivis de manière cohérente. Les propositions 4 et 5 portent sur le séjour, le retour et les interdictions d’entrée, des conséquences qui, en droit, ne peuvent s’appliquer qu’aux non-ressortissants. C’est pourquoi elles sont formulées ainsi.

      La pétition ne prétend pas que les émeutes sont causées principalement par des étrangers, et elle ne doit pas servir à stigmatiser un groupe quel qu’il soit. Chaque décision doit reposer sur le comportement propre à la personne, établi dans le cadre d’une procédure régulière, et jamais sur la nationalité, l’origine, l’origine ethnique ou la religion.

  - q: "Est-il légal de placer des personnes en détention avant une décision définitive ?"
    a: |
      La détention n’est légale que sur une base prévue par la loi et sous contrôle judiciaire, comme l’exige l’article 5 de la Convention européenne des droits de l’homme. Cela comprend la détention de suspects dans le cadre de procédures pénales et, pour les personnes en séjour irrégulier, la rétention en vue du retour au titre de la directive « retour » de l’UE.

      La pétition demande que, dans le cadre de ces règles, ces personnes puissent être retenues temporairement dans des structures simples mais humaines, conformes aux normes européennes, avec accès à un avocat, droit de contester la détention devant un tribunal et limites de durée strictes.

  - q: "Quelqu’un pourrait-il être renvoyé vers un pays où il serait en danger ?"
    a: |
      Non. Le principe de non-refoulement est absolu : nul ne peut être renvoyé vers un pays où il risquerait réellement la torture, des traitements inhumains ou dégradants, ou des persécutions. La pétition le respecte expressément. Toute décision de retour doit suivre une évaluation individuelle et peut être contestée devant un tribunal.

  - q: "Qu’en est-il des citoyens des autres pays de l’UE ?"
    a: |
      Les citoyens de l’UE jouissent de la libre circulation, qui ne peut être restreinte que pour des raisons d’ordre public ou de sécurité publique, à des conditions strictes fixées par le droit de l’Union (directive 2004/38/CE) : la décision doit se fonder sur le comportement personnel de l’intéressé, qui doit représenter une menace réelle, actuelle et suffisamment grave, et doit être proportionnée. La pétition demande que ces règles existantes soient appliquées de manière cohérente, et non qu’elles soient modifiées.

  - q: "Le droit actuel ne permet-il pas déjà l’essentiel de ces mesures ?"
    a: |
      Dans de nombreux pays, en partie, oui. Bon nombre des outils que nous mentionnons, comme le système d’information Schengen, les règles de séjour fondées sur l’ordre public ou les cadres d’assistance militaire, existent déjà sous une forme ou une autre. Dans la pratique, ils sont souvent appliqués de manière incohérente, lente ou sans moyens suffisants, et les règles diffèrent fortement d’un pays à l’autre.

      La pétition demande aux décideurs de combler les lacunes, d’établir des cadres clairs là où ils font défaut et d’appliquer les règles existantes de manière cohérente et équitable. Nous préférons le dire ouvertement plutôt que de prétendre qu’il faut tout inventer à partir de zéro.

  - q: "Des manifestants pacifiques pourraient-ils être traités à tort comme des émeutiers ?"
    a: |
      Ce risque est réel, et c’est pourquoi la pétition insiste sur des garanties : une évaluation individuelle du comportement de chaque personne, des preuves qui tiennent devant un tribunal, un contrôle juridictionnel, un contrôle indépendant de la police et le droit à un recours effectif. Le simple fait d’être présent à un rassemblement où des violences se produisent ne doit jamais être considéré, en soi, comme une infraction.

  - q: "Que devient ma signature ?"
    a: |
      Votre nom et votre pays sont stockés de manière sécurisée et ne sont jamais publiés. Lors de la remise de la pétition, nous communiquons le nombre total de signatures et le nombre par pays, mais pas les noms. Votre adresse e-mail, si vous l’avez indiquée, ne sert qu’à éviter les doublons et, si vous l’avez demandé, à vous envoyer quelques messages d’information.

      Toutes les signatures sont supprimées au plus tard six mois après la remise de la pétition. Consultez la politique de confidentialité pour plus de détails.

  - q: "Puis-je retirer ma signature ?"
    a: |
      Oui, à tout moment. Après avoir signé, vous recevez un code de retrait personnel. Saisissez-le sur la page de retrait et votre signature est immédiatement supprimée. Si vous avez perdu le code, écrivez à privacy@public-order.eu et nous traiterons votre demande dans un délai d’un mois.

  - q: "Qui peut signer ?"
    a: |
      Toute personne âgée de 16 ans ou plus qui soutient la pétition ; nous accueillons tout particulièrement les résidents des pays de l’UE et de l’EEE. Merci de ne signer qu’une seule fois et sous votre vrai nom. Les signatures manifestement fausses ou offensantes sont supprimées.

  - q: "Pourquoi faire confiance à une pétition dont les organisateurs ne sont pas nommés ?"
    a: |
      C’est une question légitime. Le sujet étant politiquement sensible, nous ne publions ni les noms ni les adresses des organisateurs à titre individuel, afin de protéger leur sécurité. Ce que nous publions, en revanche, c’est tout ce dont vous avez besoin pour nous juger : notre texte intégral, nos engagements et nos règles de confidentialité. Vous pouvez retirer votre signature à tout moment, et vous pouvez toujours nous joindre par e-mail. Nous demandons à être jugés sur ce que nous proposons et sur la manière dont nous traitons vos données.
