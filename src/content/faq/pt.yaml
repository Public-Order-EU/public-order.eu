items:
  - q: Quem está por detrás desta petição?
    a: |
      A European Public Order Initiative é organizada coletivamente por cidadãos e residentes de vários países europeus. Somos independentes e não estamos associados a nenhum partido político, governo, empresa ou instituição da UE.

      Apresentamos deliberadamente a petição de forma coletiva, sem porta-vozes individuais, para que a discussão se centre nas propostas e não nas personalidades. Pela segurança das pessoas envolvidas, não publicamos os nomes nem as moradas de cada um dos organizadores. Os organizadores são responsáveis pela petição e pelos seus dados, e podem ser sempre contactados (ver o aviso legal).

  - q: Trata-se de uma Iniciativa de Cidadania Europeia oficial?
    a: |
      Não. Uma Iniciativa de Cidadania Europeia (ICE) oficial tem de ser registada na Comissão Europeia e recolher assinaturas segundo as regras estritas do Regulamento (UE) 2019/788. Esta é uma petição independente que mostra o apoio público e é entregue aos decisores.

      As assinaturas aqui recolhidas não podem ser contabilizadas para uma ICE oficial. Se os organizadores alguma vez registarem uma, di-lo-emos claramente e explicaremos como assiná-la.

  - q: Não estão, na realidade, a tentar restringir o direito de protesto?
    a: |
      Não. O primeiro pedido da petição é proteger o protesto pacífico, incluindo aquele com que possamos discordar. Acreditamos que a violência é uma das maiores ameaças a esse direito: põe em perigo os participantes pacíficos, desacredita a sua causa e é muitas vezes usada como argumento para restringir as manifestações em geral.

      A petição visa atos violentos concretos (incêndios criminosos, pilhagem e agressões a pessoas ou bens), não as opiniões de qualquer grupo. Qualquer medida deve respeitar a liberdade de reunião protegida pelo artigo 11.º da Convenção Europeia dos Direitos Humanos.

  - q: Recorrer aos militares para a ordem pública não é perigoso para a democracia?
    a: |
      É uma preocupação séria, e a história dá boas razões para cautela. É precisamente por isso que a petição apenas apoia a assistência militar como último recurso, quando a capacidade policial estiver comprovadamente esgotada, e apenas em condições estritas: um quadro jurídico adotado previamente pelo parlamento, uma decisão das autoridades civis, fiscalização parlamentar, limites temporais, direção policial, tarefas principalmente de apoio e nunca contra reuniões pacíficas.

      Vários países europeus já dispõem de quadros deste tipo; algumas constituições limitam estritamente o emprego das forças armadas no território nacional. Pedimos um debate democrático aberto, dentro das regras constitucionais de cada país, e não que essas regras sejam contornadas.

  - q: Porque é que algumas propostas dizem respeito apenas a pessoas que não são cidadãs?
    a: |
      O direito penal aplica-se por igual a todos os que cometem violência, seja qual for a sua nacionalidade, e a petição pede a perseguição coerente de todos os infratores. As propostas 4 e 5 dizem respeito à residência, ao regresso e às proibições de entrada, consequências que, por força da lei, só podem aplicar-se a não nacionais. É por isso que estão formuladas dessa forma.

      A petição não afirma que os motins sejam causados sobretudo por estrangeiros, nem deve ser utilizada para estigmatizar qualquer grupo. Qualquer decisão deve basear-se na conduta da própria pessoa, apurada mediante o devido processo, e nunca na nacionalidade, na origem, na etnia ou na religião.

  - q: É legal deter pessoas antes de uma decisão final?
    a: |
      A detenção só é legal quando tem base na lei e está sujeita a controlo jurisdicional, como exige o artigo 5.º da Convenção Europeia dos Direitos Humanos. Isto inclui a detenção de suspeitos em processo penal e, no caso de pessoas sem residência legal, a detenção com vista ao regresso, nos termos da Diretiva Regresso da UE.

      A petição pede que, no âmbito destas regras, essas pessoas possam ser retidas temporariamente em instalações simples mas humanas, que cumpram as normas europeias, com acesso a um advogado, direito de impugnar a detenção perante um tribunal e prazos estritos.

  - q: Poderia alguém ser enviado de volta para um país onde correria perigo?
    a: |
      Não. O princípio da não repulsão é absoluto: ninguém pode ser enviado para um país onde corra um risco real de tortura, de tratamento desumano ou degradante, ou de perseguição. A petição respeita-o expressamente. Qualquer decisão de regresso tem de seguir uma avaliação individual e pode ser impugnada em tribunal.

  - q: E os cidadãos de outros países da UE?
    a: |
      Os cidadãos da UE gozam de livre circulação, que só pode ser restringida por razões de ordem pública ou de segurança pública, nas condições estritas fixadas pelo direito da União (Diretiva 2004/38/CE): a decisão deve basear-se exclusivamente no comportamento pessoal do interessado, que deve representar uma ameaça real, atual e suficientemente grave, e deve ser proporcionada. A petição pede que estas regras já existentes sejam aplicadas de forma coerente, e não que sejam alteradas.

  - q: A legislação em vigor já não permite a maior parte disto?
    a: |
      Em muitos países, em parte sim. Muitos dos instrumentos que referimos, como o Sistema de Informação de Schengen, as regras de residência por razões de ordem pública ou os quadros de assistência militar, já existem de alguma forma. Na prática, são muitas vezes aplicados de forma incoerente, lenta ou sem recursos adequados, e as regras diferem muito de país para país.

      A petição pede aos decisores que colmatem lacunas, estabeleçam quadros claros onde estes não existam e apliquem as regras existentes de forma coerente e justa. Preferimos dizê-lo abertamente a fingir que tudo tem de ser inventado de raiz.

  - q: Os manifestantes pacíficos poderiam ser tratados indevidamente como amotinados?
    a: |
      Esse risco é real, e é por isso que a petição insiste em garantias: uma avaliação individual da conduta de cada pessoa, provas que resistam em tribunal, controlo jurisdicional, fiscalização independente da polícia e direito a um recurso efetivo. Estar presente numa reunião em que ocorre violência nunca deve, por si só, ser tratado como uma infração.

  - q: O que acontece à minha assinatura?
    a: |
      O seu nome e o seu país são armazenados em segurança e nunca são publicados. Quando a petição for entregue, comunicamos o número total de assinaturas e o número por país, não os nomes. O seu endereço de e-mail, se o tiver indicado, é utilizado apenas para evitar duplicados e, se o tiver pedido, para lhe enviar algumas informações.

      Todas as assinaturas são eliminadas, o mais tardar, seis meses após a entrega da petição. Consulte a política de privacidade para mais pormenores.

  - q: Posso retirar a minha assinatura?
    a: |
      Sim, em qualquer momento. Depois de assinar, recebe um código pessoal de retirada. Introduza-o na página de retirada e a sua assinatura é eliminada de imediato. Se perdeu o código, escreva para privacy@public-order.eu e trataremos o seu pedido no prazo de um mês.

  - q: Quem pode assinar?
    a: |
      Qualquer pessoa com 16 anos ou mais que apoie a petição; acolhemos com especial agrado os residentes em países da UE e do EEE. Assine apenas uma vez e com o seu nome verdadeiro. As assinaturas evidentemente falsas ou ofensivas são removidas.

  - q: Porque devo confiar numa petição sem organizadores identificados?
    a: |
      É uma pergunta legítima. Como o tema é politicamente sensível, não publicamos os nomes nem as moradas de cada um dos organizadores, para proteger a sua segurança. O que publicamos é tudo o que é necessário para nos avaliar: o nosso texto integral, os nossos compromissos e as nossas regras de privacidade. Pode retirar a sua assinatura em qualquer momento e podemos ser sempre contactados por e-mail. Pedimos que nos julguem pelo que propomos e pela forma como tratamos os seus dados.
