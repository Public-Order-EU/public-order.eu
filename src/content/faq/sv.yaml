items:
  - q: Vem står bakom det här uppropet?
    a: |
      European Public Order Initiative organiseras gemensamt av medborgare och invånare i flera europeiska länder. Vi är oberoende och inte knutna till något politiskt parti, någon regering, något företag eller någon EU-institution.

      Vi presenterar medvetet uppropet kollektivt, utan enskilda talespersoner, så att diskussionen hålls till förslagen snarare än till personer. Av hänsyn till de inblandades säkerhet publicerar vi inte enskilda organisatörers namn eller adresser. Organisatörerna ansvarar för uppropet och för dina uppgifter och går alltid att nå (se den juridiska informationen).

  - q: Är det här ett officiellt europeiskt medborgarinitiativ?
    a: |
      Nej. Ett officiellt europeiskt medborgarinitiativ måste registreras hos Europeiska kommissionen och samla in underskrifter enligt de strikta regler som fastställs i förordning (EU) 2019/788. Det här är ett oberoende upprop som visar allmänhetens stöd och som överlämnas till beslutsfattare.

      Underskrifter som samlas in här kan inte räknas med i ett officiellt medborgarinitiativ. Om organisatörerna någon gång registrerar ett sådant säger vi det tydligt och förklarar hur man skriver under.

  - q: Försöker ni egentligen inte bara begränsa demonstrationsrätten?
    a: |
      Nej. Uppropets första krav är att skydda fredliga protester – även sådana som vi kanske inte håller med om. Vi anser att våld är ett av de största hoten mot den rättigheten: det utsätter fredliga deltagare för fara, misskrediterar deras sak och används ofta som argument för att begränsa demonstrationer över huvud taget.

      Uppropet riktar sig mot konkreta våldshandlingar – mordbränder, plundring och attacker mot människor eller egendom – inte mot någon grupps åsikter. Varje åtgärd måste respektera den mötesfrihet som skyddas av artikel 11 i Europakonventionen.

  - q: Är det inte farligt för demokratin att använda militären för att upprätthålla ordningen?
    a: |
      Det är en allvarlig farhåga, och historien ger goda skäl till försiktighet. Just därför stöder uppropet militärt bistånd endast som sista utväg, när polisens kapacitet uppenbart inte räcker till, och endast under strikta villkor: en rättslig ram som parlamentet antagit i förväg, ett beslut av de civila myndigheterna, parlamentarisk tillsyn, tidsgränser, polisiär ledning, främst stödjande uppgifter och aldrig mot fredliga sammankomster.

      Flera europeiska länder har redan sådana ramar; vissa konstitutioner sätter strikta gränser för inhemsk insats. Vi vill ha en öppen demokratisk debatt inom varje lands konstitutionella regler – inte att reglerna kringgås.

  - q: Varför gäller vissa förslag bara personer som inte är medborgare?
    a: |
      Straffrätten gäller lika för alla som begår våld, oavsett nationalitet, och uppropet kräver att alla gärningsmän lagförs konsekvent. Förslag 4 och 5 gäller uppehållsrätt, återvändande och inreseförbud – följder som enligt lag bara kan tillämpas på icke-medborgare. Därför är de formulerade så.

      Uppropet påstår inte att kravaller främst orsakas av utlänningar, och det får inte användas för att stigmatisera någon grupp. Varje beslut måste bygga på den enskildes eget handlande, fastställt genom rättssäker prövning – aldrig på nationalitet, ursprung, etnicitet eller religion.

  - q: Är det lagligt att frihetsberöva människor innan det finns ett slutligt beslut?
    a: |
      Frihetsberövande är bara lagligt när det har stöd i lag och står under domstols kontroll, så som artikel 5 i Europakonventionen kräver. Det gäller både frihetsberövande av misstänkta i brottmål och, för personer utan laglig vistelse, förvar för att verkställa återvändande enligt EU:s återvändandedirektiv.

      Uppropet vill att sådana personer, inom dessa regler, tillfälligt ska kunna hållas i enkla men humana lokaler som uppfyller europeiska standarder – med tillgång till advokat, rätt att få frihetsberövandet prövat av domstol och strikta tidsgränser.

  - q: Kan någon skickas tillbaka till ett land där personen skulle vara i fara?
    a: |
      Nej. Principen om non-refoulement är absolut: ingen får återsändas till ett land där personen riskerar tortyr, omänsklig eller förnedrande behandling eller förföljelse. Uppropet respekterar uttryckligen detta. Varje beslut om återvändande måste föregås av en individuell bedömning och kan överklagas till domstol.

  - q: Hur är det med medborgare i andra EU-länder?
    a: |
      EU-medborgare har rätt till fri rörlighet, som bara får begränsas av hänsyn till allmän ordning eller allmän säkerhet under de strikta villkor som anges i EU-rätten (direktiv 2004/38/EG): beslutet måste grunda sig på personens eget beteende, som måste utgöra ett verkligt, aktuellt och tillräckligt allvarligt hot, och måste vara proportionerligt. Uppropet vill att dessa befintliga regler tillämpas konsekvent – inte att de ändras.

  - q: Tillåter inte gällande rätt redan det mesta av detta?
    a: |
      I många länder delvis, ja. Många av de verktyg vi nämner – som Schengens informationssystem, uppehållsregler av ordningsskäl eller ramar för militärt bistånd – finns redan i någon form. I praktiken tillämpas de ofta inkonsekvent, långsamt eller utan tillräckliga resurser, och reglerna skiljer sig mycket åt mellan länderna.

      Uppropet uppmanar beslutsfattare att täppa till luckor, skapa tydliga ramar där sådana saknas och tillämpa befintliga regler konsekvent och rättvist. Vi säger hellre det öppet än låtsas att allt måste uppfinnas från grunden.

  - q: Kan fredliga demonstranter felaktigt behandlas som kravallmakare?
    a: |
      Risken är verklig, och därför insisterar uppropet på rättssäkerhetsgarantier: en individuell bedömning av varje persons handlande, bevisning som håller i domstol, domstolsprövning, oberoende tillsyn av polisen och rätt till ett effektivt rättsmedel. Att vara närvarande vid en sammankomst där våld förekommer får aldrig i sig behandlas som ett brott.

  - q: Vad händer med min underskrift?
    a: |
      Ditt namn och ditt land lagras säkert och publiceras aldrig. När uppropet överlämnas redovisar vi det totala antalet underskrifter och antalet per land – inte namn. Din e-postadress, om du har angett någon, används bara för att förhindra dubbletter och, om du har bett om det, för att skicka dig några meddelanden.

      Alla underskrifter raderas senast sex månader efter att uppropet har överlämnats. Se integritetspolicyn för mer information.

  - q: Kan jag återkalla min underskrift?
    a: |
      Ja, när som helst. När du har skrivit under får du en personlig återkallelsekod. Ange den på sidan för återkallelse så raderas din underskrift omedelbart. Om du har tappat bort koden, skriv till privacy@public-order.eu så behandlar vi din begäran inom en månad.

  - q: Vem kan skriva under?
    a: |
      Alla som är 16 år eller äldre och stöder uppropet – vi välkomnar särskilt invånare i EU- och EES-länder. Skriv bara under en gång och med ditt riktiga namn. Underskrifter som uppenbart är falska eller kränkande tas bort.

  - q: Varför ska jag lita på ett upprop utan namngivna organisatörer?
    a: |
      En rimlig fråga. Eftersom ämnet är politiskt känsligt publicerar vi inte enskilda organisatörers namn eller adresser, för att skydda deras säkerhet. Det vi däremot publicerar är allt du behöver för att bedöma oss: vår fullständiga text, våra åtaganden och våra integritetsregler. Du kan när som helst återkalla din underskrift, och vi går alltid att nå via e-post. Vi ber att bli bedömda efter vad vi föreslår och hur vi hanterar dina uppgifter.
