items:
  - q: Wer steht hinter dieser Petition?
    a: |
      Die European Public Order Initiative wird gemeinschaftlich von Bürgerinnen und Bürgern sowie Einwohnern mehrerer europäischer Länder organisiert. Wir sind unabhängig und mit keiner politischen Partei, Regierung, keinem Unternehmen und keiner EU-Institution verbunden.

      Wir stellen die Petition bewusst gemeinschaftlich vor, ohne einzelne Sprecher, damit die Diskussion bei den Vorschlägen bleibt und nicht bei Personen. Zum Schutz der beteiligten Personen veröffentlichen wir weder die Namen noch die Anschriften einzelner Organisatoren. Die Organisatoren sind für die Petition und für Ihre Daten verantwortlich und jederzeit erreichbar (siehe Rechtliche Hinweise).

  - q: Ist dies eine offizielle Europäische Bürgerinitiative?
    a: |
      Nein. Eine offizielle Europäische Bürgerinitiative (EBI) muss bei der Europäischen Kommission registriert werden und Unterschriften nach den strengen Regeln der Verordnung (EU) 2019/788 sammeln. Dies hier ist eine unabhängige Petition, die öffentliche Unterstützung sichtbar macht und den Entscheidungsträgern übergeben wird.

      Die hier gesammelten Unterschriften können nicht auf eine offizielle EBI angerechnet werden. Sollten die Organisatoren jemals eine registrieren, werden wir dies deutlich sagen und erklären, wie man sie unterzeichnen kann.

  - q: Wollen Sie in Wahrheit nicht das Recht auf Protest einschränken?
    a: |
      Nein. Die erste Forderung der Petition lautet, friedlichen Protest zu schützen – auch Protest, mit dem wir nicht einverstanden sein mögen. Wir halten Gewalt für eine der größten Bedrohungen dieses Rechts: Sie gefährdet friedlich Teilnehmende, diskreditiert deren Anliegen und wird oft als Argument genutzt, Demonstrationen insgesamt einzuschränken.

      Die Petition richtet sich gegen konkrete Gewalttaten – Brandstiftung, Plünderungen und Angriffe auf Menschen oder Eigentum –, nicht gegen die Ansichten irgendeiner Gruppe. Jede Maßnahme muss die durch Artikel 11 der Europäischen Menschenrechtskonvention geschützte Versammlungsfreiheit achten.

  - q: Ist der Einsatz des Militärs für die öffentliche Ordnung nicht gefährlich für die Demokratie?
    a: |
      Das ist ein ernstzunehmendes Bedenken, und die Geschichte liefert gute Gründe zur Vorsicht. Genau deshalb unterstützt die Petition militärische Hilfe nur als letztes Mittel, wenn die Polizeikapazität nachweislich überfordert ist, und nur unter strengen Bedingungen: ein vom Parlament im Voraus beschlossener Rechtsrahmen, eine Entscheidung der zivilen Behörden, parlamentarische Kontrolle, zeitliche Begrenzung, polizeiliche Leitung, überwiegend unterstützende Aufgaben und niemals gegen friedliche Versammlungen.

      Mehrere europäische Länder haben bereits solche Rahmen; manche Verfassungen schränken den Einsatz im Inneren streng ein. Wir fordern eine offene demokratische Debatte im Rahmen der Verfassungsordnung jedes Landes – nicht die Umgehung dieser Regeln.

  - q: Warum betreffen manche Vorschläge nur Menschen ohne die Staatsangehörigkeit des Landes?
    a: |
      Das Strafrecht gilt für alle, die Gewalt ausüben, gleichermaßen, unabhängig von der Staatsangehörigkeit, und die Petition fordert die konsequente Verfolgung aller Täter. Die Vorschläge 4 und 5 betreffen Aufenthalt, Rückführung und Einreiseverbote – Folgen, die rechtlich nur Nichtstaatsangehörige treffen können. Deshalb sind sie so formuliert.

      Die Petition behauptet nicht, Krawalle gingen überwiegend von Ausländern aus, und sie darf nicht dazu benutzt werden, eine Gruppe zu stigmatisieren. Jede Entscheidung muss auf dem eigenen Verhalten einer Person beruhen, das in einem rechtsstaatlichen Verfahren festgestellt wurde – nie auf Staatsangehörigkeit, Herkunft, ethnischer Zugehörigkeit oder Religion.

  - q: Ist es rechtmäßig, Menschen vor einer endgültigen Entscheidung festzuhalten?
    a: |
      Freiheitsentziehung ist nur auf gesetzlicher Grundlage und unter richterlicher Kontrolle rechtmäßig, wie es Artikel 5 der Europäischen Menschenrechtskonvention verlangt. Das umfasst die Untersuchungshaft von Verdächtigen in Strafverfahren und, bei Personen ohne rechtmäßigen Aufenthalt, die Haft zur Vorbereitung der Rückführung nach der EU-Rückführungsrichtlinie.

      Die Petition fordert, dass solche Personen im Rahmen dieser Regeln vorübergehend in einfachen, aber menschenwürdigen Einrichtungen untergebracht werden können, die europäischen Standards entsprechen – mit Zugang zu einem Anwalt, dem Recht, die Haft vor einem Gericht anzufechten, und strengen zeitlichen Grenzen.

  - q: Könnte jemand in ein Land zurückgeschickt werden, in dem er in Gefahr wäre?
    a: |
      Nein. Der Grundsatz der Nichtzurückweisung gilt uneingeschränkt: Niemand darf in ein Land zurückgeführt werden, in dem ihm ernsthaft Folter, unmenschliche oder erniedrigende Behandlung oder Verfolgung drohen. Die Petition achtet dies ausdrücklich. Jede Rückführungsentscheidung muss auf einer Einzelfallprüfung beruhen und kann gerichtlich angefochten werden.

  - q: Und was ist mit Staatsangehörigen anderer EU-Länder?
    a: |
      Unionsbürger genießen Freizügigkeit, die nur aus Gründen der öffentlichen Ordnung oder Sicherheit und unter den strengen Voraussetzungen des Unionsrechts (Richtlinie 2004/38/EG) eingeschränkt werden darf: Die Entscheidung muss auf dem persönlichen Verhalten der Person beruhen, das eine tatsächliche, gegenwärtige und hinreichend schwere Gefahr darstellen muss, und sie muss verhältnismäßig sein. Die Petition fordert, diese bestehenden Regeln konsequent anzuwenden – nicht, sie zu ändern.

  - q: Erlaubt das geltende Recht nicht schon das meiste davon?
    a: |
      In vielen Ländern teilweise ja. Viele der genannten Instrumente – etwa das Schengener Informationssystem, aufenthaltsrechtliche Regeln aus Gründen der öffentlichen Ordnung oder Rahmen für militärische Unterstützung – gibt es in irgendeiner Form bereits. In der Praxis werden sie oft uneinheitlich, schleppend oder ohne ausreichende Mittel angewendet, und die Regeln unterscheiden sich von Land zu Land erheblich.

      Die Petition bittet die Entscheidungsträger, Lücken zu schließen, dort klare Rahmen zu schaffen, wo sie fehlen, und bestehende Regeln konsequent und fair anzuwenden. Wir sagen das lieber offen, als so zu tun, als müsse alles von Grund auf neu erfunden werden.

  - q: Könnten friedlich Demonstrierende fälschlich als Randalierer behandelt werden?
    a: |
      Dieses Risiko besteht, und deshalb besteht die Petition auf Garantien: eine Einzelfallprüfung des Verhaltens jeder Person, vor Gericht tragfähige Beweise, gerichtliche Kontrolle, unabhängige Aufsicht über die Polizei und das Recht auf einen wirksamen Rechtsbehelf. Die bloße Anwesenheit bei einer Versammlung, bei der es zu Gewalt kommt, darf niemals für sich genommen als Straftat behandelt werden.

  - q: Was geschieht mit meiner Unterschrift?
    a: |
      Ihr Name und Ihr Land werden sicher gespeichert und nie veröffentlicht. Bei der Übergabe der Petition melden wir die Gesamtzahl der Unterschriften und die Zahl je Land – keine Namen. Ihre E-Mail-Adresse, falls Sie eine angegeben haben, dient nur dazu, Duplikate zu verhindern und, falls Sie es gewünscht haben, Ihnen einige Nachrichten zu senden.

      Alle Unterschriften werden spätestens sechs Monate nach der Übergabe der Petition gelöscht. Einzelheiten finden Sie in der Datenschutzerklärung.

  - q: Kann ich meine Unterschrift zurückziehen?
    a: |
      Ja, jederzeit. Nach dem Unterschreiben erhalten Sie einen persönlichen Rückzugscode. Geben Sie ihn auf der Seite zum Zurückziehen ein, und Ihre Unterschrift wird sofort gelöscht. Wenn Sie den Code verloren haben, schreiben Sie an privacy@public-order.eu; wir bearbeiten Ihre Anfrage innerhalb eines Monats.

  - q: Wer kann unterschreiben?
    a: |
      Alle ab 16 Jahren, die die Petition unterstützen – besonders willkommen sind Einwohner von EU- und EWR-Ländern. Bitte unterschreiben Sie nur einmal und mit Ihrem echten Namen. Offensichtlich gefälschte oder anstößige Unterschriften werden entfernt.

  - q: Warum sollte ich einer Petition ohne namentlich genannte Organisatoren vertrauen?
    a: |
      Eine berechtigte Frage. Weil das Thema politisch sensibel ist, veröffentlichen wir die Namen und Anschriften einzelner Organisatoren nicht, um deren Sicherheit zu schützen. Veröffentlicht ist dagegen alles, was Sie brauchen, um uns zu beurteilen: unser vollständiger Text, unsere Zusagen und unsere Datenschutzregeln. Sie können Ihre Unterschrift jederzeit zurückziehen, und wir sind jederzeit per E-Mail erreichbar. Wir bitten darum, uns an dem zu messen, was wir vorschlagen, und daran, wie wir mit Ihren Daten umgehen.
