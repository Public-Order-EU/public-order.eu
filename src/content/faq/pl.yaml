items:
  - q: Kto stoi za tą petycją?
    a: |
      European Public Order Initiative jest organizowana wspólnie przez obywateli i mieszkańców kilku państw europejskich. Jesteśmy niezależni i niepowiązani z żadną partią polityczną, rządem, firmą ani instytucją UE.

      Petycję przedstawiamy świadomie zbiorowo, bez indywidualnych rzeczników, aby dyskusja skupiała się na postulatach, a nie na osobach. Dla bezpieczeństwa osób zaangażowanych nie publikujemy imion, nazwisk ani adresów poszczególnych organizatorów. Organizatorzy odpowiadają za petycję i za Twoje dane i zawsze można się z nimi skontaktować (zob. notę prawną).

  - q: "Czy to oficjalna europejska inicjatywa obywatelska?"
    a: |
      Nie. Oficjalna europejska inicjatywa obywatelska (EIO) musi zostać zarejestrowana w Komisji Europejskiej, a podpisy zbiera się według ścisłych zasad określonych w rozporządzeniu (UE) 2019/788. Nasza petycja jest niezależna: ma pokazać poparcie społeczne i zostanie przekazana decydentom.

      Podpisy zebrane tutaj nie mogą zostać zaliczone do oficjalnej EIO. Jeśli organizatorzy kiedykolwiek zarejestrują taką inicjatywę, jasno o tym poinformujemy i wyjaśnimy, jak ją podpisać.

  - q: "Czy w rzeczywistości nie chcecie ograniczyć prawa do protestu?"
    a: |
      Nie. Pierwszym postulatem petycji jest ochrona pokojowych protestów — także tych, z którymi możemy się nie zgadzać. Uważamy, że przemoc jest jednym z największych zagrożeń dla tego prawa: zagraża uczestnikom pokojowym, dyskredytuje ich sprawę i bywa wykorzystywana jako argument za całkowitym ograniczeniem manifestacji.

      Petycja dotyczy konkretnych aktów przemocy — podpaleń, grabieży i ataków na ludzi lub mienie — a nie poglądów jakiejkolwiek grupy. Każdy środek musi respektować wolność zgromadzeń chronioną przez art. 11 Europejskiej Konwencji Praw Człowieka.

  - q: "Czy używanie wojska do utrzymania porządku publicznego nie jest niebezpieczne dla demokracji?"
    a: |
      To poważna obawa, a historia daje dobre powody do ostrożności. Właśnie dlatego petycja popiera pomoc wojska wyłącznie jako środek ostateczny, gdy siły policyjne są wyraźnie niewystarczające, i tylko pod ścisłymi warunkami: wcześniej przyjęte przez parlament ramy prawne, decyzja władz cywilnych, nadzór parlamentu, ograniczenie w czasie, kierownictwo policji, głównie zadania pomocnicze i nigdy użycie przeciwko pokojowym zgromadzeniom.

      Kilka państw europejskich ma już takie ramy; niektóre konstytucje ściśle ograniczają wewnętrzne użycie wojska. Prosimy o otwartą, demokratyczną debatę w ramach przepisów konstytucyjnych każdego państwa — nie o ich omijanie.

  - q: "Dlaczego niektóre postulaty dotyczą tylko osób niebędących obywatelami?"
    a: |
      Prawo karne stosuje się jednakowo do każdego, kto dopuszcza się przemocy, bez względu na narodowość, a petycja domaga się konsekwentnego ścigania wszystkich sprawców. Postulaty 4 i 5 dotyczą pobytu, powrotu i zakazów wjazdu — skutków, które z mocy prawa mogą dotyczyć wyłącznie osób niebędących obywatelami. Dlatego są tak sformułowane.

      Petycja nie twierdzi, że zamieszki są powodowane głównie przez cudzoziemców, i nie wolno jej wykorzystywać do stygmatyzowania żadnej grupy. Każda decyzja musi opierać się na własnym zachowaniu danej osoby, ustalonym w drodze należytej procedury — nigdy na narodowości, pochodzeniu etnicznym ani religii.

  - q: "Czy zatrzymywanie osób przed ostateczną decyzją jest zgodne z prawem?"
    a: |
      Zatrzymanie jest zgodne z prawem tylko wtedy, gdy ma podstawę w ustawie i podlega kontroli sądowej, zgodnie z art. 5 Europejskiej Konwencji Praw Człowieka. Dotyczy to zatrzymania podejrzanych w postępowaniu karnym oraz, w przypadku osób bez legalnego pobytu, zatrzymania w celu wydalenia na podstawie dyrektywy powrotowej UE.

      Petycja postuluje, aby w tych granicach takie osoby można było czasowo przetrzymywać w prostych, ale humanitarnych ośrodkach spełniających standardy europejskie — z dostępem do adwokata, prawem do zaskarżenia zatrzymania do sądu i ścisłymi limitami czasowymi.

  - q: "Czy ktoś mógłby zostać odesłany do kraju, w którym grozi mu niebezpieczeństwo?"
    a: |
      Nie. Zasada non-refoulement ma charakter bezwzględny: nikt nie może zostać odesłany do kraju, w którym groziłoby mu realne ryzyko tortur, nieludzkiego lub poniżającego traktowania albo prześladowania. Petycja wyraźnie ją respektuje. Każda decyzja o powrocie musi zapaść po indywidualnej ocenie i może zostać zaskarżona do sądu.

  - q: "A obywatele innych państw UE?"
    a: |
      Obywatele UE korzystają ze swobody przemieszczania się, którą można ograniczyć ze względu na porządek publiczny lub bezpieczeństwo publiczne wyłącznie na ścisłych warunkach określonych w prawie UE (dyrektywa 2004/38/WE): decyzja musi opierać się na własnym zachowaniu danej osoby, które musi stanowić rzeczywiste, aktualne i dostatecznie poważne zagrożenie, oraz być proporcjonalna. Petycja domaga się konsekwentnego stosowania tych istniejących zasad — a nie ich zmiany.

  - q: "Czy obecne prawo nie pozwala już na większość tych rzeczy?"
    a: |
      W wielu państwach częściowo tak. Wiele z wymienianych przez nas narzędzi — takich jak System Informacyjny Schengen, przepisy o pobycie ze względu na porządek publiczny czy ramy pomocy wojska — istnieje już w pewnej formie. W praktyce są one często stosowane niekonsekwentnie, powoli lub bez odpowiednich zasobów, a przepisy w poszczególnych państwach bardzo się różnią.

      Petycja zwraca się do decydentów, aby usuwali luki, tworzyli jasne ramy tam, gdzie ich brakuje, oraz stosowali istniejące przepisy konsekwentnie i sprawiedliwie. Wolimy mówić o tym otwarcie, niż udawać, że wszystko trzeba wymyślać od nowa.

  - q: "Czy uczestnicy pokojowych protestów mogą zostać błędnie potraktowani jak uczestnicy zamieszek?"
    a: |
      To ryzyko jest realne i dlatego petycja nalega na gwarancje: indywidualną ocenę zachowania każdej osoby, dowody, które obronią się przed sądem, kontrolę sądową, niezależny nadzór nad policją i prawo do skutecznego środka odwoławczego. Sama obecność na zgromadzeniu, na którym doszło do przemocy, nigdy nie może być traktowana jako przestępstwo.

  - q: "Co dzieje się z moim podpisem?"
    a: |
      Twoje imię i nazwisko oraz kraj są bezpiecznie przechowywane i nigdy nie są publikowane. Przy przekazaniu petycji podajemy łączną liczbę podpisów i liczbę podpisów w poszczególnych krajach — bez imion i nazwisk. Twój adres e-mail, jeśli go podałeś(-aś), służy wyłącznie do zapobiegania duplikatom oraz, jeśli o to poprosiłeś(-aś), do wysłania Ci kilku wiadomości.

      Wszystkie podpisy są usuwane najpóźniej sześć miesięcy po przekazaniu petycji. Szczegóły znajdziesz w polityce prywatności.

  - q: "Czy mogę wycofać swój podpis?"
    a: |
      Tak, w każdej chwili. Po podpisaniu otrzymujesz osobisty kod wycofania. Wpisz go na stronie wycofania podpisu, a Twój podpis zostanie natychmiast usunięty. Jeśli zgubisz kod, napisz na adres privacy@public-order.eu, a rozpatrzymy Twoją prośbę w ciągu jednego miesiąca.

  - q: "Kto może podpisać?"
    a: |
      Każdy, kto ma co najmniej 16 lat i popiera petycję — szczególnie zapraszamy mieszkańców państw UE i EOG. Podpisz tylko raz i swoim prawdziwym imieniem i nazwiskiem. Podpisy oczywiście fałszywe lub obraźliwe są usuwane.

  - q: "Dlaczego miałbym ufać petycji bez podanych z nazwiska organizatorów?"
    a: |
      Uczciwe pytanie. Ponieważ temat jest politycznie wrażliwy, nie publikujemy imion, nazwisk ani adresów poszczególnych organizatorów, aby chronić ich bezpieczeństwo. Publikujemy natomiast wszystko, co jest potrzebne, aby nas ocenić: pełny tekst, nasze zobowiązania i zasady ochrony prywatności. Możesz w każdej chwili wycofać swój podpis, a my zawsze jesteśmy osiągalni drogą e-mailową. Prosimy o ocenę nas po tym, co proponujemy i jak postępujemy z Twoimi danymi.
