items:
  - q: Kas stovi už šios peticijos?
    a: |
      European Public Order Initiative kolektyviai organizuoja kelių Europos šalių piliečiai ir gyventojai. Esame nepriklausomi ir nesusiję su jokia politine partija, vyriausybe, įmone ar ES institucija.

      Peticiją sąmoningai pateikiame kolektyviai, be atskirų atstovų, kad diskusija sutelktų dėmesį į pasiūlymus, o ne į asmenybes. Siekdami užtikrinti dalyvaujančių žmonių saugumą, neskelbiame atskirų organizatorių vardų, pavardžių ar adresų. Organizatoriai atsako už peticiją ir už jūsų duomenis, ir su jais visada galima susisiekti (žr. teisinę informaciją).

  - q: "Ar tai oficiali Europos piliečių iniciatyva?"
    a: |
      Ne. Oficiali Europos piliečių iniciatyva (EPI) turi būti užregistruota Europos Komisijoje, o parašai renkami laikantis griežtų Reglamente (ES) 2019/788 nustatytų taisyklių. Tai nepriklausoma peticija, kuria siekiama parodyti visuomenės palaikymą, ir ji bus įteikta sprendimų priėmėjams.

      Čia surinkti parašai negali būti įskaičiuoti į oficialią EPI. Jei organizatoriai kada nors užregistruos tokią iniciatyvą, apie tai aiškiai pranešime ir paaiškinsime, kaip ją pasirašyti.

  - q: "Ar iš tikrųjų nesistengiate apriboti teisės protestuoti?"
    a: |
      Ne. Pirmasis peticijos reikalavimas — apsaugoti taikų protestą, taip pat ir tokį, su kuriuo galime nesutikti. Manome, kad smurtas yra viena didžiausių grėsmių šiai teisei: jis kelia pavojų taikiems dalyviams, diskredituoja jų reikalą ir dažnai naudojamas kaip argumentas visiškai apriboti demonstracijas.

      Peticija nukreipta prieš konkrečius smurto veiksmus — padegimus, plėšimus ir išpuolius prieš žmones ar turtą — o ne prieš kurios nors grupės pažiūras. Kiekviena priemonė turi gerbti susirinkimų laisvę, kurią saugo Europos žmogaus teisių konvencijos 11 straipsnis.

  - q: "Ar kariuomenės naudojimas viešajai tvarkai palaikyti nėra pavojingas demokratijai?"
    a: |
      Tai rimtas rūpestis, o istorija duoda pagrindo būti atsargiems. Būtent todėl peticija remia kariuomenės pagalbą tik kaip kraštutinę priemonę, kai policijos pajėgų akivaizdžiai nepakanka, ir tik laikantis griežtų sąlygų: parlamento iš anksto priimta teisinė sistema, civilinių institucijų sprendimas, parlamento priežiūra, laiko apribojimai, policijos vadovavimas, daugiausia pagalbinės užduotys ir jokiu būdu ne prieš taikius susirinkimus.

      Kelios Europos šalys tokias sistemas jau turi; kai kurios konstitucijos griežtai riboja panaudojimą šalies viduje. Prašome atviros demokratinės diskusijos laikantis kiekvienos šalies konstitucinių taisyklių — o ne tų taisyklių apėjimo.

  - q: "Kodėl kai kurie pasiūlymai susiję tik su ne piliečiais?"
    a: |
      Baudžiamoji teisė vienodai taikoma kiekvienam, kuris naudoja smurtą, nepriklausomai nuo tautybės, ir peticija prašo nuosekliai persekioti visus kaltininkus. 4 ir 5 pasiūlymai susiję su leidimu gyventi, grąžinimu ir draudimu atvykti — pasekmėmis, kurios pagal įstatymus gali būti taikomos tik ne piliečiams. Todėl jie taip ir suformuluoti.

      Peticija nesako, kad riaušes daugiausia kelia užsieniečiai, ir jos negalima naudoti jokiai grupei stigmatizuoti. Kiekvienas sprendimas turi būti grindžiamas paties asmens elgesiu, nustatytu laikantis tinkamo proceso — niekada tautybe, kilme, etnine kilme ar religija.

  - q: "Ar teisėta sulaikyti žmones prieš priimant galutinį sprendimą?"
    a: |
      Sulaikyti galima tik įstatyme numatytu pagrindu ir prižiūrint teismui, kaip reikalauja Europos žmogaus teisių konvencijos 5 straipsnis. Tai apima įtariamųjų sulaikymą baudžiamajame procese ir, asmenų, neturinčių teisėto leidimo gyventi šalyje, atveju — sulaikymą siekiant juos grąžinti pagal ES Grąžinimo direktyvą.

      Peticija prašo, kad pagal šias taisykles tokius asmenis būtų galima laikinai laikyti paprastose, bet žmogiškose patalpose, atitinkančiose Europos standartus — su teise į advokatą, teise sulaikymą apskųsti teismui ir griežtais laiko apribojimais.

  - q: "Ar kas nors gali būti grąžintas į šalį, kurioje jam gresia pavojus?"
    a: |
      Ne. Negrąžinimo (non-refoulement) principas yra absoliutus: niekas negali būti grąžintas į šalį, kurioje jam grėstų reali kankinimų, nežmoniško ar žeminančio elgesio arba persekiojimo rizika. Peticija tai aiškiai gerbia. Kiekvienas sprendimas dėl grąžinimo turi būti priimtas atlikus individualų vertinimą ir gali būti skundžiamas teisme.

  - q: "O kitų ES šalių piliečiai?"
    a: |
      ES piliečiai naudojasi laisvu judėjimu, kurį dėl viešosios tvarkos ar visuomenės saugumo galima riboti tik laikantis griežtų ES teisėje (Direktyva 2004/38/EB) nustatytų sąlygų: sprendimas turi būti grindžiamas paties asmens elgesiu, kuris turi kelti realią, esamą ir pakankamai rimtą grėsmę, ir turi būti proporcingas. Peticija prašo šias esamas taisykles taikyti nuosekliai — o ne jas keisti.

  - q: "Ar galiojantys įstatymai jau neleidžia daugumos to padaryti?"
    a: |
      Daugelyje šalių iš dalies taip. Daug mūsų minimų priemonių — pavyzdžiui, Šengeno informacinė sistema, leidimo gyventi taisyklės dėl viešosios tvarkos pagrindų ar kariuomenės pagalbos sistemos — tam tikra forma jau egzistuoja. Praktiškai jos dažnai taikomos nenuosekliai, lėtai arba be pakankamų išteklių, o taisyklės įvairiose šalyse labai skiriasi.

      Peticija prašo sprendimų priėmėjų užpildyti spragas, nustatyti aiškią sistemą ten, kur jos trūksta, ir nuosekliai bei sąžiningai taikyti esamas taisykles. Mieliau apie tai kalbame atvirai, nei apsimetame, kad viską reikia išrasti iš naujo.

  - q: "Ar taikūs protestuotojai gali būti klaidingai palaikyti riaušininkais?"
    a: |
      Ši rizika reali, todėl peticija reikalauja garantijų: individualaus kiekvieno asmens elgesio vertinimo, teisme patikimų įrodymų, teisminės peržiūros, nepriklausomos policijos priežiūros ir teisės į veiksmingą gynimo priemonę. Dalyvavimas susirinkime, kuriame kilo smurtas, savaime niekada negali būti laikomas pažeidimu.

  - q: "Kas bus su mano parašu?"
    a: |
      Jūsų vardas, pavardė ir šalis saugiai saugomi ir niekada neskelbiami. Įteikdami peticiją, nurodome bendrą parašų skaičių ir parašų skaičių pagal šalis — ne vardus ir pavardes. Jūsų el. pašto adresas, jei jį nurodėte, naudojamas tik dublikatams išvengti ir, jei paprašėte, kad atsiųstume jums kelis pranešimus.

      Visi parašai ištrinami ne vėliau kaip po šešių mėnesių nuo peticijos įteikimo. Daugiau informacijos rasite privatumo politikoje.

  - q: "Ar galiu atšaukti savo parašą?"
    a: |
      Taip, bet kada. Pasirašę gaunate asmeninį atšaukimo kodą. Įveskite jį atšaukimo puslapyje ir jūsų parašas bus ištrintas nedelsiant. Jei pamiršote kodą, rašykite adresu privacy@public-order.eu ir jūsų prašymą išnagrinėsime per vieną mėnesį.

  - q: "Kas gali pasirašyti?"
    a: |
      Kiekvienas, kuriam yra 16 metų ar daugiau ir kuris palaiko peticiją — ypač kviečiame ES ir EEE šalių gyventojus. Prašome pasirašyti tik vieną kartą ir tikru vardu bei pavarde. Akivaizdžiai suklastoti ar įžeidžiantys parašai pašalinami.

  - q: "Kodėl turėčiau pasitikėti peticija, kurios organizatoriai nenurodyti vardais?"
    a: |
      Teisingas klausimas. Kadangi tema politiškai jautri, neskelbiame atskirų organizatorių vardų, pavardžių ar adresų, kad apsaugotume jų saugumą. Skelbiame viską, ko reikia mums įvertinti: visą tekstą, savo įsipareigojimus ir privatumo taisykles. Savo parašą galite atšaukti bet kada, o su mumis visada galima susisiekti el. paštu. Prašome vertinti mus pagal tai, ką siūlome ir kaip elgiamės su jūsų duomenimis.
