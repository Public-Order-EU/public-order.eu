items:
  - q: "Kas ir aiz šīs petīcijas?"
    a: |
      European Public Order Initiative kolektīvi organizē vairāku Eiropas valstu pilsoņi un iedzīvotāji. Mēs esam neatkarīgi un nesaistīti ne ar vienu politisko partiju, valdību, uzņēmumu vai ES iestādi.

      Mēs apzināti iesniedzam petīciju kolektīvi, bez atsevišķiem pārstāvjiem, lai diskusija koncentrētos uz priekšlikumiem, nevis uz personībām. Iesaistīto cilvēku drošības labad mēs nepublicējam atsevišķu organizatoru vārdus un adreses. Organizatori ir atbildīgi par petīciju un jūsu datiem, un ar viņiem vienmēr var sazināties (skatiet juridisko informāciju).

  - q: "Vai šī ir oficiāla Eiropas pilsoņu iniciatīva?"
    a: |
      Nē. Oficiāla Eiropas pilsoņu iniciatīva ir jāreģistrē Eiropas Komisijā, un paraksti jāvāc saskaņā ar stingriem noteikumiem, kas paredzēti Regulā (ES) 2019/788. Šī ir neatkarīga petīcija, kas parāda sabiedrības atbalstu un tiek nodota lēmumu pieņēmējiem.

      Šeit savāktos parakstus nevar ieskaitīt oficiālā Eiropas pilsoņu iniciatīvā. Ja organizatori kādreiz reģistrēs šādu iniciatīvu, mēs to skaidri paziņosim un paskaidrosim, kā to parakstīt.

  - q: "Vai patiesībā jūs necenšaties ierobežot tiesības protestēt?"
    a: |
      Nē. Petīcijas pirmā prasība ir aizsargāt mierīgu protestu, arī tādu, ar kuru mēs varbūt nepiekrītam. Mēs uzskatām, ka vardarbība ir viens no lielākajiem draudiem šīm tiesībām: tā apdraud mierīgus dalībniekus, diskreditē viņu mērķi un bieži tiek izmantota kā arguments, lai demonstrācijas ierobežotu pavisam.

      Petīcija ir vērsta pret konkrētām vardarbīgām darbībām — dedzināšanu, laupīšanu un uzbrukumiem cilvēkiem vai īpašumam —, nevis pret kādas grupas uzskatiem. Katram pasākumam jāievēro pulcēšanās brīvība, ko aizsargā Eiropas Cilvēktiesību konvencijas 11. pants.

  - q: "Vai militārpersonu izmantošana sabiedriskās kārtības nodrošināšanai nav bīstama demokrātijai?"
    a: |
      Tas ir nopietns pamats raizēm, un vēsture dod labus iemeslus piesardzībai. Tieši tāpēc petīcija atbalsta militāru palīdzību tikai kā galējo līdzekli, kad policijas spējas acīmredzami ir nepietiekamas, un tikai stingros nosacījumos: parlamenta iepriekš pieņemts tiesiskais regulējums, civilo iestāžu lēmums, parlamentārā uzraudzība, laika ierobežojumi, policijas vadība, galvenokārt atbalsta uzdevumi un nekad pret mierīgām pulcēšanās norisēm.

      Vairākām Eiropas valstīm šādi regulējumi jau ir; dažas konstitūcijas stingri ierobežo bruņoto spēku izmantošanu valsts iekšienē. Mēs aicinām uz atklātu demokrātisku diskusiju katras valsts konstitucionālo noteikumu ietvaros — nevis uz to apiešanu.

  - q: "Kāpēc daži priekšlikumi attiecas tikai uz personām, kas nav pilsoņi?"
    a: |
      Krimināltiesības vienādi attiecas uz ikvienu, kas izdara vardarbību, neatkarīgi no tautības, un petīcija prasa konsekventi saukt pie atbildības visus likumpārkāpējus. Priekšlikumi Nr. 4 un Nr. 5 attiecas uz uzturēšanos, atgriešanu un ieceļošanas aizliegumiem — sekām, ko saskaņā ar likumu var piemērot tikai personām, kas nav pilsoņi. Tāpēc tie ir tā formulēti.

      Petīcija neapgalvo, ka nekārtību iemesls galvenokārt ir ārvalstnieki, un to nedrīkst izmantot, lai stigmatizētu kādu grupu. Katram lēmumam jābalstās uz paša cilvēka rīcību, kas noskaidrota pienācīgā procesā, — nekad uz tautību, izcelsmi, etnisko piederību vai reliģiju.

  - q: "Vai ir likumīgi aizturēt cilvēkus pirms galīgā lēmuma?"
    a: |
      Aizturēšana ir likumīga tikai uz likumā paredzēta pamata un tiesas uzraudzībā, kā to prasa Eiropas Cilvēktiesību konvencijas 5. pants. Tas ietver aizdomās turēto aizturēšanu kriminālprocesā un — personām bez likumīgas uzturēšanās tiesībām — aizturēšanu nolūkā tās atgriezt saskaņā ar ES Atgriešanas direktīvu.

      Petīcija prasa, lai šajos noteikumos šādas personas varētu uz laiku turēt vienkāršās, bet humānās telpās, kas atbilst Eiropas standartiem, nodrošinot piekļuvi advokātam, tiesības apstrīdēt aizturēšanu tiesā un stingrus laika ierobežojumus.

  - q: "Vai kādu var nosūtīt atpakaļ uz valsti, kur viņam draud briesmas?"
    a: |
      Nē. Neizraidīšanas princips ir absolūts: nevienu nedrīkst atgriezt valstī, kur viņam draudētu reāls spīdzināšanas, necilvēcīgas vai pazemojošas izturēšanās vai vajāšanas risks. Petīcija to nepārprotami ievēro. Katram lēmumam par atgriešanu jābalstās uz individuālu izvērtējumu, un to var apstrīdēt tiesā.

  - q: "Kā ir ar citu ES valstu pilsoņiem?"
    a: |
      ES pilsoņiem ir tiesības uz brīvu pārvietošanos, ko var ierobežot tikai sabiedriskās kārtības vai sabiedriskās drošības apsvērumu dēļ, stingros nosacījumos, kas noteikti ES tiesībās (Direktīva 2004/38/EK): lēmumam jābalstās uz paša cilvēka rīcību, kurai jārada reāli, aktuāli un pietiekami nopietni draudi, un tam jābūt samērīgam. Petīcija prasa šos esošos noteikumus piemērot konsekventi — nevis tos mainīt.

  - q: "Vai spēkā esošie tiesību akti jau neatļauj lielāko daļu no šī?"
    a: |
      Daudzās valstīs daļēji atļauj. Daudzi mūsu minētie instrumenti — piemēram, Šengenas Informācijas sistēma, uzturēšanās noteikumi sabiedriskās kārtības apsvērumu dēļ vai militārā atbalsta regulējumi — jau pastāv kādā formā. Praksē tos bieži piemēro nekonsekventi, lēni vai bez pietiekamiem resursiem, un noteikumi dažādās valstīs ļoti atšķiras.

      Petīcija aicina lēmumu pieņēmējus aizpildīt nepilnības, noteikt skaidru regulējumu tur, kur tā trūkst, un piemērot esošos noteikumus konsekventi un taisnīgi. Mēs labāk to sakām atklāti, nevis izlikāmies, ka viss jāizdomā no jauna.

  - q: "Vai mierīgus protestētājus var kļūdaini uzskatīt par nekārtību dalībniekiem?"
    a: |
      Šis risks ir reāls, un tāpēc petīcija uzstāj uz garantijām: katra cilvēka rīcības individuālu izvērtējumu, pierādījumiem, kas iztur pārbaudi tiesā, tiesas kontroli, neatkarīgu policijas uzraudzību un tiesībām uz efektīviem tiesību aizsardzības līdzekļiem. Atrašanās pulcēšanās vietā, kur notiek vardarbība, nekad pati par sevi nedrīkst tikt uzskatīta par pārkāpumu.

  - q: "Kas notiek ar manu parakstu?"
    a: |
      Jūsu vārds, uzvārds un valsts tiek droši glabāti un nekad netiek publicēti. Kad petīcija tiks nodota, mēs ziņosim kopējo parakstu skaitu un parakstu skaitu pa valstīm — nevis vārdus un uzvārdus. Jūsu e-pasta adrese, ja to norādījāt, tiek izmantota tikai dublikātu novēršanai un, ja to pieprasījāt, dažu jaunumu nosūtīšanai.

      Visi paraksti tiek dzēsti ne vēlāk kā sešus mēnešus pēc petīcijas nodošanas. Sīkāku informāciju skatiet privātuma politikā.

  - q: "Vai es varu atsaukt savu parakstu?"
    a: |
      Jā, jebkurā laikā. Pēc parakstīšanās jūs saņemat personisku atsaukšanas kodu. Ievadiet to atsaukšanas lapā, un jūsu paraksts tiks izdzēsts nekavējoties. Ja esat pazaudējis kodu, rakstiet uz privacy@public-order.eu, un mēs izskatīsim jūsu pieprasījumu viena mēneša laikā.

  - q: "Kas drīkst parakstīt?"
    a: |
      Ikviens, kas ir sasniedzis 16 gadu vecumu un atbalsta petīciju; īpaši aicinām parakstīties ES un EEZ valstu iedzīvotājus. Lūdzu, parakstieties tikai vienu reizi un ar savu īsto vārdu. Acīmredzami viltoti vai aizskaroši paraksti tiek dzēsti.

  - q: "Kāpēc lai es uzticētos petīcijai bez nosauktiem organizatoriem?"
    a: |
      Godīgs jautājums. Tā kā tēma ir politiski jutīga, mēs nepublicējam atsevišķu organizatoru vārdus un adreses, lai aizsargātu viņu drošību. Taču mēs publicējam visu, kas nepieciešams, lai jūs varētu mūs novērtēt: pilnu tekstu, mūsu apņemšanos un privātuma noteikumus. Jūs jebkurā laikā varat atsaukt savu parakstu, un ar mums vienmēr var sazināties pa e-pastu. Lūdzam vērtēt mūs pēc tā, ko piedāvājam un kā rīkojamies ar jūsu datiem.
