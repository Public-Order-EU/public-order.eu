items:
  - q: Wie zit er achter deze petitie?
    a: |
      De European Public Order Initiative wordt collectief georganiseerd door burgers en inwoners van meerdere Europese landen. Wij zijn onafhankelijk en niet verbonden aan een politieke partij, regering, onderneming of EU-instelling.

      We presenteren de petitie bewust collectief, zonder individuele woordvoerders, zodat de discussie gaat over de voorstellen en niet over personen. Voor de veiligheid van de betrokken personen publiceren we de namen of adressen van individuele organisatoren niet. De organisatoren zijn verantwoordelijk voor de petitie en voor uw gegevens, en zijn altijd bereikbaar (zie de juridische informatie).

  - q: Is dit een officieel Europees burgerinitiatief?
    a: |
      Nee. Een officieel Europees burgerinitiatief (EBI) moet worden geregistreerd bij de Europese Commissie en handtekeningen verzamelen volgens de strikte regels van Verordening (EU) 2019/788. Dit is een onafhankelijke petitie die steun uit de samenleving zichtbaar maakt en aan besluitvormers wordt aangeboden.

      Handtekeningen die hier worden verzameld, kunnen niet meetellen voor een officieel EBI. Als de organisatoren ooit een EBI registreren, zullen we dat duidelijk melden en uitleggen hoe u kunt ondertekenen.

  - q: Wilt u in feite niet gewoon het recht om te protesteren beperken?
    a: |
      Nee. De eerste eis van de petitie is vreedzaam protest te beschermen – ook protest waar wij het misschien niet mee eens zijn. Wij vinden geweld een van de grootste bedreigingen voor dat recht: het brengt vreedzame deelnemers in gevaar, brengt hun zaak in diskrediet en wordt vaak gebruikt als argument om demonstraties helemaal te beperken.

      De petitie richt zich op concrete gewelddaden – brandstichting, plundering en aanvallen op mensen of eigendommen – en niet op de opvattingen van welke groep dan ook. Elke maatregel moet de vrijheid van vergadering respecteren die door artikel 11 van het Europees Verdrag voor de Rechten van de Mens wordt beschermd.

  - q: Is het inzetten van het leger voor de openbare orde niet gevaarlijk voor de democratie?
    a: |
      Het is een serieuze zorg, en de geschiedenis geeft goede redenen voor voorzichtigheid. Daarom steunt de petitie militaire bijstand alleen als laatste redmiddel, wanneer de politiecapaciteit aantoonbaar tekortschiet, en alleen onder strikte voorwaarden: een wettelijk kader dat vooraf door het parlement is vastgesteld, een besluit van de civiele autoriteiten, parlementair toezicht, tijdsbeperkingen, politieleiding, voornamelijk ondersteunende taken, en nooit tegen vreedzame bijeenkomsten.

      Verschillende Europese landen hebben al zulke kaders; sommige grondwetten beperken de inzet in eigen land strikt. Wij vragen om een open democratisch debat binnen de grondwettelijke regels van elk land – niet om die regels te omzeilen.

  - q: Waarom hebben sommige voorstellen alleen betrekking op mensen zonder de nationaliteit van het land?
    a: |
      Het strafrecht geldt voor iedereen die geweld pleegt op gelijke wijze, ongeacht nationaliteit, en de petitie vraagt om consequente vervolging van alle daders. Voorstellen 4 en 5 gaan over verblijf, terugkeer en inreisverboden – gevolgen die wettelijk alleen voor niet-onderdanen kunnen gelden. Daarom zijn ze zo geformuleerd.

      De petitie beweert niet dat rellen vooral door buitenlanders worden veroorzaakt, en mag niet worden gebruikt om een groep te stigmatiseren. Elk besluit moet gebaseerd zijn op iemands eigen gedrag, vastgesteld via een eerlijke procedure – nooit op nationaliteit, afkomst, etniciteit of godsdienst.

  - q: Is het rechtmatig om mensen vast te houden vóór een definitieve beslissing?
    a: |
      Vasthouding is alleen rechtmatig op een wettelijke grondslag en onder rechterlijk toezicht, zoals artikel 5 van het Europees Verdrag voor de Rechten van de Mens vereist. Dat omvat de voorlopige hechtenis van verdachten in strafprocedures en, voor personen zonder wettig verblijf, vreemdelingenbewaring met het oog op terugkeer op grond van de EU-terugkeerrichtlijn.

      De petitie vraagt dat zulke personen binnen deze regels tijdelijk kunnen worden vastgehouden in sobere maar humane voorzieningen die aan Europese normen voldoen – met toegang tot een advocaat, het recht om de vasthouding voor een rechter aan te vechten en strikte tijdslimieten.

  - q: Zou iemand kunnen worden teruggestuurd naar een land waar hij of zij gevaar loopt?
    a: |
      Nee. Het beginsel van non-refoulement is absoluut: niemand mag worden teruggestuurd naar een land waar die persoon een reëel risico loopt op foltering, onmenselijke of vernederende behandeling, of vervolging. De petitie respecteert dit uitdrukkelijk. Elk terugkeerbesluit moet volgen op een individuele beoordeling en kan bij de rechter worden aangevochten.

  - q: En burgers van andere EU-landen?
    a: |
      EU-burgers genieten vrij verkeer, dat alleen om redenen van openbare orde of openbare veiligheid mag worden beperkt onder de strikte voorwaarden van het EU-recht (Richtlijn 2004/38/EG): het besluit moet gebaseerd zijn op het eigen gedrag van de persoon, dat een actuele, werkelijke en voldoende ernstige bedreiging moet vormen, en moet evenredig zijn. De petitie vraagt om deze bestaande regels consequent toe te passen – niet om ze te wijzigen.

  - q: Staat de bestaande wetgeving niet al het meeste hiervan toe?
    a: |
      In veel landen gedeeltelijk wel. Veel van de instrumenten die we noemen – zoals het Schengeninformatiesysteem, verblijfsregels om redenen van openbare orde of kaders voor militaire bijstand – bestaan al in enige vorm. In de praktijk worden ze vaak inconsistent, traag of zonder voldoende middelen toegepast, en de regels verschillen sterk van land tot land.

      De petitie vraagt besluitvormers om lacunes te dichten, waar ze ontbreken duidelijke kaders te scheppen en bestaande regels consequent en eerlijk toe te passen. We zeggen dit liever openlijk dan dat we doen alsof alles van de grond af opnieuw moet worden uitgevonden.

  - q: Kunnen vreedzame demonstranten ten onrechte als relschoppers worden behandeld?
    a: |
      Dat risico bestaat, en daarom staat de petitie op waarborgen: een individuele beoordeling van het gedrag van elke persoon, bewijs dat voor de rechter standhoudt, rechterlijke toetsing, onafhankelijk toezicht op de politie en het recht op een daadwerkelijk rechtsmiddel. Aanwezigheid bij een bijeenkomst waar geweld plaatsvindt, mag nooit op zichzelf als strafbaar feit worden behandeld.

  - q: Wat gebeurt er met mijn handtekening?
    a: |
      Uw naam en land worden veilig opgeslagen en nooit gepubliceerd. Wanneer de petitie wordt aangeboden, rapporteren we het totale aantal handtekeningen en het aantal per land – geen namen. Uw e-mailadres, als u het hebt opgegeven, wordt alleen gebruikt om dubbelen te voorkomen en, als u erom hebt gevraagd, om u enkele berichten te sturen.

      Alle handtekeningen worden uiterlijk zes maanden nadat de petitie is aangeboden verwijderd. Zie het privacybeleid voor details.

  - q: Kan ik mijn handtekening intrekken?
    a: |
      Ja, op elk moment. Na het ondertekenen ontvangt u een persoonlijke intrekkingscode. Voer die in op de pagina voor het intrekken van een handtekening en uw handtekening wordt onmiddellijk verwijderd. Als u de code kwijt bent, schrijf dan naar privacy@public-order.eu en we handelen uw verzoek binnen één maand af.

  - q: Wie kan ondertekenen?
    a: |
      Iedereen van 16 jaar of ouder die de petitie steunt – inwoners van EU- en EER-landen zijn extra welkom. Onderteken alstublieft maar één keer en met uw echte naam. Handtekeningen die duidelijk vals of aanstootgevend zijn, worden verwijderd.

  - q: Waarom zou ik een petitie vertrouwen zonder bij naam genoemde organisatoren?
    a: |
      Een terechte vraag. Omdat het onderwerp politiek gevoelig ligt, publiceren we de namen of adressen van individuele organisatoren niet, om hun veiligheid te beschermen. Wat we wel publiceren, is alles wat u nodig hebt om ons te beoordelen: onze volledige tekst, onze toezeggingen en onze privacyregels. U kunt uw handtekening op elk moment intrekken en we zijn altijd per e-mail bereikbaar. We vragen om beoordeeld te worden op wat we voorstellen en op hoe we met uw gegevens omgaan.
