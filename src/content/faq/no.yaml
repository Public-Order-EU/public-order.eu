items:
  - q: "Hvem står bak denne underskriftskampanjen?"
    a: |
      European Public Order Initiative er organisert kollektivt av borgere og innbyggere i flere europeiske land. Vi er uavhengige og har ingen tilknytning til noe politisk parti, noen regjering, noen bedrift eller noen EU-institusjon.

      Vi har bevisst valgt å presentere underskriftskampanjen kollektivt, uten enkeltstående talspersoner, slik at debatten handler om forslagene og ikke om personer. For å beskytte sikkerheten til de involverte offentliggjør vi ikke navn eller adresser på de enkelte arrangørene. Arrangørene er ansvarlige for underskriftskampanjen og for opplysningene dine, og kan alltid kontaktes (se den juridiske informasjonen).

  - q: "Er dette et offisielt europeisk borgerinitiativ?"
    a: |
      Nei. Et offisielt europeisk borgerinitiativ (EBI) må registreres hos Europakommisjonen og samle underskrifter etter de strenge reglene i forordning (EU) 2019/788. Dette er en uavhengig underskriftskampanje som viser offentlig støtte og overleveres til beslutningstakere.

      Underskrifter som samles inn her, kan ikke telle med i et offisielt EBI. Hvis arrangørene noen gang registrerer et, vil vi si det tydelig og forklare hvordan du kan skrive under på det.

  - q: "Prøver dere egentlig ikke bare å begrense retten til å demonstrere?"
    a: |
      Nei. Det første kravet i underskriftskampanjen er å beskytte fredelig demonstrasjon – også demonstrasjoner vi selv kan være uenige i. Vi mener at vold er en av de største truslene mot denne retten: den setter fredelige deltakere i fare, diskrediterer saken deres og brukes ofte som argument for å begrense demonstrasjoner helt.

      Underskriftskampanjen retter seg mot konkrete voldshandlinger – brannstiftelse, plyndring og angrep på mennesker eller eiendom – ikke mot noen gruppes synspunkter. Alle tiltak må respektere forsamlingsfriheten som er beskyttet av artikkel 11 i Den europeiske menneskerettskonvensjon.

  - q: "Er det ikke farlig for demokratiet å bruke militæret til å opprettholde den offentlige orden?"
    a: |
      Det er en alvorlig bekymring, og historien gir gode grunner til forsiktighet. Nettopp derfor støtter underskriftskampanjen bare militær bistand som siste utvei, når politiets kapasitet påviselig er overbelastet, og bare på strenge vilkår: et rettslig rammeverk som parlamentet har vedtatt på forhånd, en beslutning fra de sivile myndighetene, parlamentarisk kontroll, tidsbegrensning, politiledelse, hovedsakelig støtteoppgaver og aldri mot fredelige forsamlinger.

      Flere europeiske land har allerede slike rammeverk; noen grunnlover setter strenge grenser for innsats innenlands. Vi ber om en åpen demokratisk debatt innenfor hvert lands konstitusjonelle regler – ikke om at reglene skal omgås.

  - q: "Hvorfor gjelder noen forslag bare personer som ikke er borgere?"
    a: |
      Straffeloven gjelder likt for alle som utøver vold, uansett nasjonalitet, og underskriftskampanjen ber om konsekvent straffeforfølgelse av alle lovbrytere. Forslag 4 og 5 gjelder opphold, retur og innreiseforbud – konsekvenser som etter loven bare kan ramme ikke-borgere. Derfor er de formulert slik.

      Underskriftskampanjen hevder ikke at opptøyer hovedsakelig skyldes utlendinger, og den må ikke brukes til å stigmatisere noen gruppe. Hver avgjørelse må bygge på den enkeltes egne handlinger, fastslått gjennom behørig saksbehandling – aldri på nasjonalitet, opprinnelse, etnisitet eller religion.

  - q: "Er det lovlig å holde personer i forvaring før det foreligger en endelig avgjørelse?"
    a: |
      Frihetsberøvelse er bare lovlig når det finnes hjemmel i lov og den er underlagt domstolskontroll, slik artikkel 5 i Den europeiske menneskerettskonvensjon krever. Det omfatter fengsling av mistenkte i straffesaker og, for personer uten lovlig opphold, forvaring med sikte på retur etter EUs returdirektiv.

      Underskriftskampanjen ber om at slike personer, innenfor disse reglene, midlertidig kan holdes i enkle, men humane fasiliteter som oppfyller europeiske standarder – med tilgang til advokat, rett til å få frihetsberøvelsen prøvd for en domstol og strenge tidsfrister.

  - q: "Kan noen bli sendt tilbake til et land der de vil være i fare?"
    a: |
      Nei. Non-refoulement-prinsippet er absolutt: ingen må returneres til et land der de risikerer tortur, umenneskelig eller nedverdigende behandling eller forfølgelse. Underskriftskampanjen respekterer dette uttrykkelig. Hver returavgjørelse må bygge på en individuell vurdering og kan bringes inn for en domstol.

  - q: "Hva med borgere av andre EU-land?"
    a: |
      EU-borgere har fri bevegelse, som bare kan begrenses av hensyn til offentlig orden eller offentlig sikkerhet på strenge vilkår fastsatt i EU-retten (direktiv 2004/38/EF): avgjørelsen må bygge på personens egne handlinger, som må utgjøre en reell, aktuell og tilstrekkelig alvorlig trussel, og den må være forholdsmessig. Underskriftskampanjen ber om at disse eksisterende reglene anvendes konsekvent – ikke at de endres.

  - q: "Tillater ikke gjeldende lovgivning det meste av dette allerede?"
    a: |
      I mange land delvis, ja. Mange av verktøyene vi nevner – som Schengen-informasjonssystemet, oppholdsregler av hensyn til offentlig orden eller rammeverk for militær bistand – finnes allerede i en eller annen form. I praksis anvendes de ofte ujevnt, tregt eller uten tilstrekkelige ressurser, og reglene varierer mye fra land til land.

      Underskriftskampanjen ber beslutningstakerne om å tette hull, fastsette tydelige rammer der de mangler, og anvende eksisterende regler konsekvent og rettferdig. Vi sier heller dette åpent enn å late som om alt må finnes opp fra bunnen av.

  - q: "Kan fredelige demonstranter bli feilaktig behandlet som opptøymakere?"
    a: |
      Den risikoen er reell, og derfor insisterer underskriftskampanjen på rettssikkerhetsgarantier: en individuell vurdering av hver persons handlinger, bevis som holder i retten, domstolsprøving, uavhengig tilsyn med politiet og rett til et effektivt rettsmiddel. Det å være til stede i en forsamling der det forekommer vold, må aldri i seg selv behandles som en lovovertredelse.

  - q: "Hva skjer med underskriften min?"
    a: |
      Navnet og landet ditt lagres sikkert og blir aldri offentliggjort. Når underskriftskampanjen overleveres, rapporterer vi det totale antallet underskrifter og antallet per land – ikke navn. E-postadressen din, hvis du oppga en, brukes bare til å hindre dobbeltunderskrifter og, hvis du ba om det, til å sende deg noen få oppdateringer.

      Alle underskrifter slettes senest seks måneder etter at underskriftskampanjen er overlevert. Se personvernerklæringen for detaljer.

  - q: "Kan jeg trekke tilbake underskriften min?"
    a: |
      Ja, når som helst. Etter at du har skrevet under, får du en personlig tilbaketrekkingskode. Skriv den inn på siden for tilbaketrekking, så slettes underskriften din umiddelbart. Hvis du har mistet koden, skriv til privacy@public-order.eu, så behandler vi forespørselen din innen én måned.

  - q: "Hvem kan skrive under?"
    a: |
      Alle som er 16 år eller eldre og støtter underskriftskampanjen – vi ønsker særlig innbyggere i EU- og EØS-land velkommen. Skriv bare under én gang, og med ditt virkelige navn. Underskrifter som åpenbart er falske eller støtende, fjernes.

  - q: "Hvorfor skal jeg stole på en underskriftskampanje uten navngitte arrangører?"
    a: |
      Et rimelig spørsmål. Fordi temaet er politisk følsomt, offentliggjør vi ikke navn eller adresser på de enkelte arrangørene, for å beskytte sikkerheten deres. Det vi offentliggjør, er alt du trenger for å vurdere oss: den fullstendige teksten vår, løftene våre og personvernreglene våre. Du kan når som helst trekke tilbake underskriften din, og du kan alltid nå oss på e-post. Vi ber om å bli vurdert på det vi foreslår og hvordan vi behandler opplysningene dine.
