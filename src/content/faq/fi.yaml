items:
  - q: Kuka tämän adressin takana on?
    a: |
      European Public Order Initiativen järjestävät yhdessä usean Euroopan maan kansalaiset ja asukkaat. Olemme itsenäisiä emmekä ole sidoksissa mihinkään poliittiseen puolueeseen, hallitukseen, yritykseen tai EU:n toimielimeen.

      Esitämme adressin tarkoituksella kollektiivisesti, ilman yksittäisiä tiedottajia, jotta keskustelu pysyy ehdotuksissa eikä henkilöissä. Osallisten turvallisuuden vuoksi emme julkaise yksittäisten järjestäjien nimiä tai osoitteita. Järjestäjät vastaavat adressista ja tiedoistasi, ja heidät voi aina tavoittaa (katso oikeudelliset tiedot).

  - q: Onko tämä virallinen eurooppalainen kansalaisaloite?
    a: |
      Ei. Virallinen eurooppalainen kansalaisaloite on rekisteröitävä Euroopan komissiossa, ja allekirjoituksia on kerättävä asetuksessa (EU) 2019/788 säädettyjen tiukkojen sääntöjen mukaisesti. Tämä on itsenäinen adressi, joka osoittaa yleisön tuen ja luovutetaan päättäjille.

      Täällä kerättyjä allekirjoituksia ei voi laskea mukaan virallisen kansalaisaloitteen allekirjoituksiin. Jos järjestäjät joskus rekisteröivät sellaisen, kerromme siitä selvästi ja ohjeistamme, miten sen voi allekirjoittaa.

  - q: Eikö todellisena tarkoituksenne ole rajoittaa mielenosoitusoikeutta?
    a: |
      Ei. Adressin ensimmäinen vaatimus on rauhanomaisen mielenosoittamisen suojeleminen – myös sellaisen, josta emme ehkä ole samaa mieltä. Uskomme, että väkivalta on yksi suurimmista tätä oikeutta uhkaavista tekijöistä: se vaarantaa rauhanomaiset osallistujat, mustaa heidän asiansa ja sitä käytetään usein perusteluna mielenosoitusten rajoittamiselle kokonaan.

      Adressi kohdistuu tiettyihin väkivallantekoihin – tuhopolttoihin, ryöstelyyn ja ihmisiin tai omaisuuteen kohdistuviin hyökkäyksiin – eikä minkään ryhmän mielipiteisiin. Jokaisen toimenpiteen on kunnioitettava Euroopan ihmisoikeussopimuksen 11 artiklassa suojattua kokoontumisvapautta.

  - q: Eikö asevoimien käyttäminen yleisen järjestyksen ylläpitoon ole vaarallista demokratialle?
    a: |
      Se on vakava huolenaihe, ja historia antaa hyvän syyn varovaisuuteen. Siksi adressi tukee sotilaallista apua vain viimeisenä keinona, kun poliisin voimavarat eivät osoitettavasti riitä, ja vain tiukoin ehdoin: parlamentin etukäteen hyväksymä oikeudellinen kehys, siviiliviranomaisten päätös, parlamentaarinen valvonta, aikarajat, poliisin johto, pääosin tukitehtävät ja ei koskaan rauhanomaisia kokoontumisia vastaan.

      Useissa Euroopan maissa tällaiset kehykset ovat jo olemassa; joidenkin maiden perustuslait rajoittavat tiukasti asevoimien käyttöä kotimaassa. Pyydämme avointa demokraattista keskustelua kunkin maan perustuslaillisten sääntöjen puitteissa – ei sitä, että näitä sääntöjä kierrettäisiin.

  - q: Miksi jotkin ehdotukset koskevat vain henkilöitä, jotka eivät ole kansalaisia?
    a: |
      Rikoslaki koskee yhtäläisesti jokaista, joka syyllistyy väkivaltaan, kansalaisuudesta riippumatta, ja adressi vaatii kaikkien tekijöiden johdonmukaista syytteeseen saattamista. Ehdotukset 4 ja 5 koskevat oleskelua, palauttamista ja maahantulokieltoja – seuraamuksia, jotka voivat lain mukaan koskea vain muita kuin kansalaisia. Siksi ne on muotoiltu näin.

      Adressi ei väitä, että mellakoiden pääasiallisia aiheuttajia olisivat ulkomaalaiset, eikä sitä saa käyttää minkään ryhmän leimaamiseen. Jokaisen päätöksen on perustuttava yksilön omaan, asianmukaisessa menettelyssä todettuun toimintaan – ei koskaan kansalaisuuteen, alkuperään, etniseen taustaan tai uskontoon.

  - q: Onko laillista ottaa ihmisiä säilöön ennen lopullista päätöstä?
    a: |
      Vapaudenmenetys on laillista vain lakiin perustuen ja tuomioistuimen valvonnassa, kuten Euroopan ihmisoikeussopimuksen 5 artikla edellyttää. Tämä koskee sekä rikosoikeudenkäynnin epäiltyjen vapaudenmenetystä että, ilman laillista oleskeluoikeutta olevien osalta, palauttamista varten tapahtuvaa säilöönottoa EU:n palautusdirektiivin nojalla.

      Adressissa pyydetään, että näissä säännöissä pysyen tällaisia henkilöitä voidaan pitää tilapäisesti yksinkertaisissa mutta inhimillisissä, eurooppalaiset vaatimukset täyttävissä tiloissa – siten, että heillä on oikeus asianajajaan, oikeus riitauttaa säilöönotto tuomioistuimessa ja tiukat aikarajat.

  - q: Voisiko jonkun palauttaa maahan, jossa hän olisi vaarassa?
    a: |
      Ei. Palaamattomuuden periaate (non-refoulement) on ehdoton: ketään ei saa palauttaa maahan, jossa hän joutuisi todelliseen kidutuksen, epäinhimillisen tai halventavan kohtelun tai vainon vaaraan. Adressi kunnioittaa tätä nimenomaisesti. Jokaisen palauttamispäätöksen on perustuttava yksilölliseen arviointiin, ja siitä voi valittaa tuomioistuimeen.

  - q: Entä muiden EU-maiden kansalaiset?
    a: |
      EU-kansalaisilla on oikeus vapaaseen liikkuvuuteen, jota voidaan rajoittaa vain yleisen järjestyksen tai yleisen turvallisuuden perusteella EU-oikeudessa (direktiivi 2004/38/EY) säädetyin tiukoin edellytyksin: päätöksen on perustuttava henkilön omaan käyttäytymiseen, jonka on muodostettava todellinen, välitön ja riittävän vakava uhka, ja päätöksen on oltava oikeasuhteinen. Adressissa pyydetään soveltamaan näitä nykyisiä sääntöjä johdonmukaisesti – ei muuttamaan niitä.

  - q: Eikö voimassa oleva laki jo salli suurimman osan tästä?
    a: |
      Monissa maissa osittain kyllä. Monet mainitsemistamme keinoista – kuten Schengenin tietojärjestelmä, yleiseen järjestykseen perustuvat oleskelusäännöt tai sotilaallisen avun kehykset – ovat jo olemassa jossakin muodossa. Käytännössä niitä sovelletaan usein epäjohdonmukaisesti, hitaasti tai riittämättömin resurssein, ja säännöt vaihtelevat maiden välillä suuresti.

      Adressissa pyydetään päättäjiä paikkaamaan aukkoja, luomaan selkeät kehykset siellä, missä niitä ei ole, ja soveltamaan voimassa olevia sääntöjä johdonmukaisesti ja oikeudenmukaisesti. Sanomme tämän mieluummin avoimesti kuin teeskentelemme, että kaikki pitäisi keksiä alusta alkaen.

  - q: Voisiko rauhanomaisia mielenosoittajia kohdella virheellisesti mellakoitsijoina?
    a: |
      Riski on todellinen, ja siksi adressissa vaaditaan suojatoimia: jokaisen henkilön toiminnan yksilöllistä arviointia, oikeudessa pitävää näyttöä, oikeudellista tarkastelua, poliisin riippumatonta valvontaa ja oikeutta tehokkaaseen oikeussuojaan. Pelkkää läsnäoloa kokoontumisessa, jossa esiintyy väkivaltaa, ei saa koskaan sellaisenaan pitää rikoksena.

  - q: Mitä allekirjoituksellesi tapahtuu?
    a: |
      Nimesi ja asuinmaasi tallennetaan turvallisesti, eikä niitä julkaista koskaan. Kun adressi luovutetaan, raportoimme allekirjoitusten kokonaismäärän ja määrän maittain – emme nimiä. Sähköpostiosoitettasi, jos annoit sellaisen, käytetään vain kaksoiskappaleiden estämiseen ja, jos sitä pyysit, muutaman tiedotteen lähettämiseen.

      Kaikki allekirjoitukset poistetaan viimeistään kuusi kuukautta adressin luovuttamisen jälkeen. Katso lisätietoja tietosuojaselosteesta.

  - q: Voinko perua allekirjoitukseni?
    a: |
      Kyllä, milloin tahansa. Allekirjoittamisen jälkeen saat henkilökohtaisen peruutuskoodin. Syötä se peruutussivulla, niin allekirjoituksesi poistetaan välittömästi. Jos olet hukannut koodin, kirjoita osoitteeseen privacy@public-order.eu, niin käsittelemme pyyntösi kuukauden kuluessa.

  - q: Kuka voi allekirjoittaa?
    a: |
      Jokainen vähintään 16-vuotias adressia tukeva – toivotamme erityisesti tervetulleiksi EU- ja ETA-maiden asukkaat. Allekirjoita vain kerran ja oikealla nimelläsi. Ilmeisen väärennetyt tai loukkaavat allekirjoitukset poistetaan.

  - q: Miksi luottaa adressiin, jolla ei ole nimettyjä järjestäjiä?
    a: |
      Aiheellinen kysymys. Koska aihe on poliittisesti arkaluonteinen, emme julkaise yksittäisten järjestäjien nimiä tai osoitteita heidän turvallisuutensa suojaamiseksi. Julkaisemme kuitenkin kaiken, mitä tarvitset arvioidaksesi meitä: täydellisen tekstimme, sitoumuksemme ja tietosuojasääntömme. Voit perua allekirjoituksesi milloin tahansa, ja meidät voi aina tavoittaa sähköpostitse. Pyydämme, että meitä arvioidaan sen perusteella, mitä ehdotamme ja miten käsittelemme tietojasi.
